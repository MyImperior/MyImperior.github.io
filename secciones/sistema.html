<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema planetario — vista a escala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #05060a; }
    canvas { display: block; }
    #ayuda {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #8fa0b5; font: 12px/1.4 Arial, sans-serif; letter-spacing: .08em;
      text-transform: uppercase; opacity: .6; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="ayuda">Pincha un mundo para acercarte · pincha el vacío para volver</div>

  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ════════════════════════════════════════════════════════════
    //  RENDERER / ESCENA / CÁMARA
    // ════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x05060a); // fondo por defecto hasta que llegue la nebulosa

    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 6000);

    // VISTA GENERAL del sistema: alejada para que la órbita exterior (~58)
    // pase justo por delante. Ajusta estos tres números por ojo.
    const VISTA_GENERAL   = new THREE.Vector3(0, 28, 62);
    const MIRADA_GENERAL  = new THREE.Vector3(0, 0, 0);
    camara.position.copy(VISTA_GENERAL);
    camara.lookAt(MIRADA_GENERAL);
    escena.add(camara); // necesario para que las estrellas (hijas de la cámara) se rendericen

    // Controles de cámara libres: arrastrar = girar, rueda = zoom, botón derecho = desplazar
    const controls = new OrbitControls(camara, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 12; // = 2 × radio del sol: impide meter la cámara DENTRO de la estrella
    controls.maxDistance = 400;
    controls.target.copy(MIRADA_GENERAL);
    controls.update();

    const cargador = new THREE.TextureLoader();

    // ════════════════════════════════════════════════════════════
    //  FONDO: campo de estrellas procedural + nebulosa opcional
    // ════════════════════════════════════════════════════════════
    (function campoEstrellas() {
      const N = 2500;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const R = 2500;
        pos[i*3]   = R * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = R * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = R * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false });
      const estrellas = new THREE.Points(geo, mat);
      camara.add(estrellas); // hijas de la cámara → cielo fijo en pantalla, no barre al girar/volar
    })();

    // Fondo PLANO encajado a la pantalla (tipo "cover"): nítido y bien
    // compuesto, sin envolver 360° (que repartía la imagen y la difuminaba).
    let texFondo = null;
    function encajarFondo() {
      if (!texFondo || !texFondo.image) return;
      const aImg = texFondo.image.width / texFondo.image.height;
      const aPant = window.innerWidth / window.innerHeight;
      if (aPant > aImg) {                 // pantalla más ancha → ajusto ancho, recorto alto
        texFondo.repeat.set(1, aImg / aPant);
        texFondo.offset.set(0, (1 - aImg / aPant) / 2);
      } else {                            // pantalla más alta → ajusto alto, recorto ancho
        texFondo.repeat.set(aPant / aImg, 1);
        texFondo.offset.set((1 - aPant / aImg) / 2, 0);
      }
    }
    cargador.load(
      '../imagenes/sistema/fondo-espacio.png',
      (t) => {
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texFondo = t;
        escena.background = t;
        encajarFondo();
      },
      undefined,
      () => { /* sin imagen aún: se queda el color + estrellas procedurales */ }
    );

    // ════════════════════════════════════════════════════════════
    //  ESTRELLA K — 100% PROCEDURAL (shader), sin imagen.
    //
    //  Por qué así: el ruido se calcula a partir de la POSICIÓN 3D de cada
    //  punto de la esfera, no de una imagen rectangular envuelta. Una
    //  función 3D no tiene bordes ni polos → no hay costura ni pellizco.
    //  Y como el ruido depende también del tiempo, la superficie evoluciona.
    //
    //  Tres piezas:
    //   1) la esfera (fotosfera): plasma, granulación, manchas, fáculas
    //      y oscurecimiento del limbo
    //   2) la corona: un plano que siempre mira a la cámara (billboard) con
    //      halo, serpentinas, protuberancias y alguna fulguración
    //   3) el bloom (más abajo, en POSTPROCESADO): la "floración" de luz
    // ════════════════════════════════════════════════════════════
    const RADIO_SOL = 6.0;

    // ── MANDOS DEL SOL (ajustar a ojo) ─────────────────────────────
    const SOL = {
      intensidad: 1.8,  // brillo del disco. >1 "quema" el centro (casi blanco) y alimenta el bloom.
                        //   Baja a ~1.2 si quieres ver detalle en el centro; sube a ~2.5 para "cegador".
      detalle:    0.8,  // 0 = disco liso · 1 = plasma, manchas y fáculas a tope
      corona:     1.0,  // brillo de halo / serpentinas / protuberancias
      velocidad:  1.0   // ritmo al que evoluciona la superficie (no afecta a la rotación)
    };
    const BLOOM = {
      fuerza: 0.6,      // cuánto se derrama la luz
      radio:  0.35,     // cuánto se extiende el derrame
      umbral: 0.95      // solo "florece" lo que supera este brillo. Con <0.9 empezaría
                        //   a florecer también el fondo de nebulosa. No bajar mucho.
    };

    // Ruido simplex 3D (Ian McEwan / Ashima Arts, licencia MIT).
    // Devuelve un valor suave entre -1 y 1 para cualquier punto 3D.
    const RUIDO_GLSL = `
      vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+10.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g  = step(x0.yzx, x0.xyz);
        vec3 l  = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j  = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x  = x_ * ns.x + ns.yyyy;
        vec4 y  = y_ * ns.x + ns.yyyy;
        vec4 h  = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 105.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }
      // fbm = varias capas de ruido a escalas cada vez más finas (como una costa:
      // bahías grandes, calas, rocas). 3 capas para lo barato, 5 para lo visible.
      float fbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a*snoise(p); p *= 2.03; a *= 0.5; } return s; }
      float fbm5(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*snoise(p); p *= 2.03; a *= 0.5; } return s; }
    `;

    // Uniforms compartidos: el TIEMPO es el mismo objeto para sol y corona.
    const uTiempo = { value: 0 };

    // ── 1) FOTOSFERA ───────────────────────────────────────────────
    // (Los colores van en espacio LINEAL: el OutputPass los convierte a sRGB al
    //  final. Por eso parecen "más oscuros" escritos aquí que en pantalla.)
    const matSol = new THREE.ShaderMaterial({
      uniforms: {
        uTiempo,
        uIntensidad: { value: SOL.intensidad },
        uDetalle:    { value: SOL.detalle }
      },
      vertexShader: `
        varying vec3 vPos;      // punto de la esfera unidad (espacio del objeto → gira con el sol)
        varying vec3 vNormalV;  // normal en espacio de cámara
        varying vec3 vViewPos;  // posición en espacio de cámara
        void main() {
          vPos = normalize(position);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vViewPos = mv.xyz;
          vNormalV = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: RUIDO_GLSL + `
        uniform float uTiempo;
        uniform float uIntensidad;
        uniform float uDetalle;
        varying vec3 vPos;
        varying vec3 vNormalV;
        varying vec3 vViewPos;
        void main() {
          vec3 p = vPos;
          float t = uTiempo;

          // mu = coseno entre la normal y la línea de visión:
          // 1 en el centro del disco, 0 en el borde (limbo)
          float mu = clamp(dot(normalize(vNormalV), normalize(-vViewPos)), 0.0, 1.0);

          // PLASMA con deformación de dominio (domain warping): el ruido se
          // muestrea en un sitio desplazado por OTRO ruido → remolinos que
          // parecen fluir en vez de manchas estáticas.
          vec3 w = vec3(fbm3(p*1.6 + vec3(0.0, 0.0,  t*0.020)),
                        fbm3(p*1.6 + vec3(5.2, 1.3, -t*0.017)),
                        fbm3(p*1.6 + vec3(9.1, 7.7,  t*0.013)));
          float plasma = fbm5(p*3.2 + w*1.4 + vec3(0.0, t*0.025, 0.0));   // ~[-1, 1]

          // GRANULACIÓN: celdas de convección muy finas
          float gran = snoise(p*38.0 + vec3(t*0.25));

          // MANCHAS: solo en dos cinturones de latitud (como en el Sol real,
          // entre ~10° y ~35°; nunca en el ecuador ni en los polos)
          float lat = abs(p.y);
          float cinturon = smoothstep(0.12, 0.25, lat) * (1.0 - smoothstep(0.45, 0.62, lat));
          float m = snoise(p*3.4 + vec3(t*0.006, 0.0, 17.0)) + 0.25*snoise(p*9.0 + 3.0);
          float penumbra = smoothstep(0.66, 0.76, m) * cinturon;
          float umbra    = smoothstep(0.80, 0.88, m) * cinturon;

          // COLOR por temperatura: el centro se ve más caliente (más claro)
          // que el borde, donde miramos capas más altas y frías
          vec3 cCentro = vec3(1.00, 0.48, 0.15);
          vec3 cBorde  = vec3(0.85, 0.16, 0.03);
          vec3 col = mix(cBorde, cCentro, pow(mu, 0.55));

          float brillo = 1.0 + uDetalle * (0.30*plasma + 0.08*gran);
          // FÁCULAS: zonas brillantes que solo destacan cerca del borde
          brillo += uDetalle * smoothstep(0.25, 0.65, plasma) * pow(1.0 - mu, 1.5) * 0.9;
          col *= brillo;
          col = mix(col, col*0.60, penumbra * uDetalle);   // penumbra: algo más oscura
          col = mix(col, col*0.22, umbra    * uDetalle);   // umbra: oscura solo en comparación (sigue a ~4000 K)

          // OSCURECIMIENTO DEL LIMBO (ley lineal). u ≈ 0.68 es típico de una
          // estrella K: más marcado que en el Sol porque es más fría.
          col *= (1.0 - 0.68*(1.0 - mu)) * uIntensidad;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const sol = new THREE.Mesh(new THREE.SphereGeometry(RADIO_SOL, 96, 96), matSol);
    escena.add(sol);

    // ── 2) CORONA (billboard) ──────────────────────────────────────
    // Un plano que en cada fotograma copia la orientación de la cámara, así
    // siempre lo vemos de frente. Dibuja lo que hay FUERA del disco.
    // Se suma a lo que hay detrás (AdditiveBlending): la luz no tapa, se añade.
    const EXT_CORONA = 3.0; // el plano llega a 3 radios solares desde el centro
    const uniCorona = {
      uTiempo,
      uK:          { value: 1.0 },          // corrección de perspectiva del borde (ver bucle)
      uIntensidad: { value: SOL.corona },
      uExt:        { value: EXT_CORONA }
    };
    const corona = new THREE.Mesh(
      new THREE.PlaneGeometry(RADIO_SOL * 2 * EXT_CORONA, RADIO_SOL * 2 * EXT_CORONA),
      new THREE.ShaderMaterial({
        uniforms: uniCorona,
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: RUIDO_GLSL + `
          uniform float uTiempo;
          uniform float uK;
          uniform float uIntensidad;
          uniform float uExt;
          varying vec2 vUv;
          void main() {
            vec2 c = (vUv - 0.5) * 2.0 * uExt;   // coordenadas en radios solares
            float rr = length(c);
            float r  = rr / uK;                  // 1.0 = borde del disco tal como se VE
            if (r < 0.97) discard;
            vec2 dir = c / rr;                   // dirección (evita atan → sin costura angular)
            float h = max(r - 1.0, 0.0);         // altura sobre el limbo
            float t = uTiempo;

            // a) HALO: una caída corta pegada al borde + otra larga y tenue
            float halo = 0.55*exp(-h*12.0) + 0.30*exp(-h*2.2);

            // b) SERPENTINAS: estructura radial que cambia despacio
            float n = snoise(vec3(dir*5.0, t*0.03 + h*0.35));
            float serp = (0.5 + 0.5*n) * exp(-h*1.8) * 0.22;

            // c) PROTUBERANCIAS: filamentos pegados al limbo, solo en algunas zonas
            float zona = smoothstep(0.35, 0.80, snoise(vec3(dir*2.2, t*0.015 + 4.0)));
            float fil  = smoothstep(0.10, 0.75, snoise(vec3(dir*16.0, h*5.0 - t*0.12)));
            float prom = zona * fil * exp(-h*6.0) * smoothstep(0.0, 0.02, h) * 1.6;

            // d) FULGURACIÓN ocasional: cada ~70 s un chorro que crece hacia
            //    fuera y se apaga en ~7 s, cada vez en una dirección distinta
            float ciclo = t * 0.09;
            float k = floor(ciclo / 6.2831853);
            float pulso = pow(max(0.0, sin(ciclo)), 14.0);
            float ang = k * 2.39996;             // ángulo áureo → direcciones bien repartidas
            float lobulo = pow(max(0.0, dot(dir, vec2(cos(ang), sin(ang)))), 60.0);
            float fil2 = 0.6 + 0.4*snoise(vec3(dir*25.0, h*3.0 - t*0.4));
            float erup = pulso * lobulo * fil2 * exp(-h*mix(7.0, 1.4, pulso)) * 3.0;

            vec3 cHalo = vec3(1.0, 0.42, 0.12);
            vec3 cProm = vec3(1.0, 0.30, 0.06);
            vec3 col = cHalo*(halo + serp) + cProm*(prom + erup);
            col *= uIntensidad;
            col *= 1.0 - smoothstep(uExt*0.77, uExt, rr);  // apagar antes del borde del plano
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    escena.add(corona);

    const luzSol = new THREE.PointLight(0xffd9a0, 4, 3000, 0.08);
    escena.add(luzSol);
    escena.add(new THREE.AmbientLight(0x223044, 0.45));

    // ════════════════════════════════════════════════════════════
    //  LUCES NOCTURNAS (tecnomarcadores)
    //  - num: cantidad (más en mundos habitables, pocas en los demás)
    //  - puntos PEGADOS a la superficie, finos y tenues.
    // ════════════════════════════════════════════════════════════
    function crearLucesNocturnas(radio, num) {
      // Distribución AGRUPADA: las luces se juntan en "núcleos" (como ciudades)
      // en vez de salpicarse uniformes por toda la esfera.
      const nNucleos = Math.max(3, Math.round(num / 25));
      const centros = [];
      for (let c = 0; c < nNucleos; c++) {
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        centros.push(new THREE.Vector3(
          Math.sin(ph) * Math.cos(th), Math.sin(ph) * Math.sin(th), Math.cos(ph)
        ));
      }
      const p = new Float32Array(num * 3);
      const brillo = new Float32Array(num); // brillo individual → menos homogéneo
      const v = new THREE.Vector3();
      for (let i = 0; i < num; i++) {
        const centro = centros[(Math.random() * nNucleos) | 0];
        // punto cerca del núcleo: el centro + un pequeño desvío, renormalizado
        v.copy(centro).addScaledVector(
          new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5),
          0.22
        ).normalize().multiplyScalar(radio);
        p[i*3] = v.x; p[i*3+1] = v.y; p[i*3+2] = v.z;
        brillo[i] = 0.25 + Math.random() * 0.75; // de tenue a medio-brillante
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      geo.setAttribute('brillo', new THREE.BufferAttribute(brillo, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: { dirLuz: { value: new THREE.Vector3(1, 0, 0) } },
        vertexShader: `
          uniform vec3 dirLuz;
          attribute float brillo;
          varying float visibilidad;
          varying float vBrillo;
          void main() {
            vec3 normalMundo = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            float cara = dot(normalMundo, dirLuz);       // >0 día, <0 noche
            visibilidad = smoothstep(0.05, -0.25, cara); // solo de noche
            vBrillo = brillo;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 0.8 + brillo * 1.0;           // tamaño variable
          }
        `,
        fragmentShader: `
          varying float visibilidad;
          varying float vBrillo;
          void main() {
            if (visibilidad < 0.01) discard;
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            // Con el bloom, la escena se mezcla en espacio LINEAL y se pasa a sRGB al final:
            // el mismo naranja (1, .8, .45) se escribe ahora (1, .6, .17), y la opacidad
            // baja de .32 a .20 para que se vean igual de tenues que antes.
            float a = visibilidad * vBrillo * 0.20;      // más tenue y según brillo propio
            gl_FragColor = vec4(1.0, 0.60, 0.17, a);
          }
        `,
        transparent: true,
        depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    // ════════════════════════════════════════════════════════════
    //  LOS MUNDOS  (ordenados por lógica térmica: del más caliente,
    //  pegado a la estrella, al más frío en el exterior)
    //
    //  r       radio (relaciones realistas: rocosos pequeños, gigante
    //          gaseoso mucho mayor, pero todos muy por debajo del sol)
    //  dist    distancia orbital
    //  incl    inclinación de la órbita (grados)
    //  color   color del punto visto de lejos
    //  luces   nº de luces de ciudad (0 = sin superficie habitada)
    //  anclado anclaje por marea. Con estrella K sólo los interiores
    //          suelen anclarse; los de la zona habitable y exteriores, no.
    // ════════════════════════════════════════════════════════════
    const mundos = [
      { tex: '5-lava.png',      r: 0.35, dist: 12, incl: 0,  color: 0xd1552e, luces: 30,  anclado: true  }, // magmático, el más interior
      { tex: '2-desertica.png', r: 0.45, dist: 16, incl: 0,  color: 0xc88a4a, luces: 120, anclado: true  }, // desértico, caliente y seco
      { tex: '8-roca.png',      r: 0.30, dist: 20, incl: 14, color: 0x8a7f72, luces: 60,  anclado: false }, // rocoso desplazado (órbita inclinada)
      { tex: '1-islas.png',     r: 0.50, dist: 26, incl: 0,  color: 0x6fae7a, luces: 650, anclado: false }, // archipiélagos — zona habitable
      { tex: '4-templado.png',  r: 0.55, dist: 31, incl: 0,  color: 0x7bbf8f, luces: 550, anclado: false }, // templado — zona habitable
      { tex: '7-estepa.png',    r: 0.45, dist: 38, incl: 0,  color: 0x9fae73, luces: 150, anclado: false }, // estepa, más frío
      { tex: '3-helado.png',    r: 0.40, dist: 46, incl: 0,  color: 0xaccadf, luces: 40,  anclado: false }, // helado, exterior
      { tex: '6-gaseoso1.png',  r: 1.40, dist: 58, incl: 0,  color: 0xb79a6e, luces: 0,   anclado: false }  // gigante gaseoso — sin superficie, sin luces
    ];

    const planetas = [];

    mundos.forEach((m) => {
      const grupo = new THREE.Group(); // se traslada por la órbita; el mesh rota dentro
      escena.add(grupo);

      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      grupo.add(mesh);

      // (sin halo: los planetas se ven como discos reales, a su tamaño)

      // Luces nocturnas pegadas a la superficie (hijas del mesh → rotan con él)
      let luces = null;
      if (m.luces > 0) {
        luces = crearLucesNocturnas(m.r * 1.0015, m.luces);
        mesh.add(luces);
      }

      const inclRad = m.incl * Math.PI / 180; // (líneas de órbita eliminadas)

      planetas.push({
        grupo, mesh, luces,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 0.005 / Math.sqrt(m.dist), // 25% de la velocidad original
        anclado: m.anclado,
        r: m.r
      });
    });

    // ════════════════════════════════════════════════════════════
    //  INTERACCIÓN: clic → vuela al planeta; clic en vacío → volver
    // ════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const raton = new THREE.Vector2();
    let enfocado = null;   // planeta enfocado (null = vista general)
    let volando = false;   // true mientras la cámara viaja a su destino
    let tProg = 0;                          // progreso de la transición 0→1 (evita el salto al fijar)
    const entryPos  = new THREE.Vector3();  // pose de cámara al arrancar la transición
    const entryMira = new THREE.Vector3();

    // Distinguir un clic real de un arrastre de los controles de cámara
    let abajoX = 0, abajoY = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { abajoX = e.clientX; abajoY = e.clientY; });

    window.addEventListener('click', (e) => {
      if (Math.hypot(e.clientX - abajoX, e.clientY - abajoY) > 6) return; // fue arrastre, no clic
      raton.x = (e.clientX / window.innerWidth) * 2 - 1;
      raton.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(raton, camara);
      const hit = ray.intersectObjects(planetas.map(p => p.mesh), false);
      if (hit.length) {
        const p = planetas.find(pp => pp.mesh === hit[0].object);
        if (p !== enfocado) { enfocado = p; volando = true; tProg = 0; entryPos.copy(camara.position); entryMira.copy(controls.target); }
      } else if (enfocado) {
        enfocado = null; volando = true; tProg = 0; entryPos.copy(camara.position); entryMira.copy(miraFoco); // volver a la vista general
      }
    });

    // ════════════════════════════════════════════════════════════
    //  BUCLE
    // ════════════════════════════════════════════════════════════
    const fuera    = new THREE.Vector3();
    const lado     = new THREE.Vector3();
    const destino  = new THREE.Vector3();
    const miraFoco = new THREE.Vector3();
    const ARRIBA   = new THREE.Vector3(0, 1, 0);

    function suavizar(t) { return t * t * (3 - 2 * t); } // smoothstep para transiciones

    // ════════════════════════════════════════════════════════════
    //  POSTPROCESADO: BLOOM (floración de luz)
    //
    //  En vez de pintar directo a pantalla, la escena se pinta en una imagen
    //  intermedia con decimales (HalfFloat), que admite brillos MAYORES que 1.
    //  El bloom coge solo lo que supera el umbral (el sol), lo difumina y lo
    //  suma encima. El OutputPass, al final, convierte a sRGB para el monitor.
    //  Por eso el sol "quema" y derrama luz, y el fondo (que nunca pasa de 1) no.
    // ════════════════════════════════════════════════════════════
    const composer = new EffectComposer(renderer);
    // Antialiasing: al pintar en imagen intermedia se pierde el del renderer;
    // se recupera pidiendo 4 muestras (MSAA) a esas imágenes.
    composer.renderTarget1.samples = 4;
    composer.renderTarget2.samples = 4;
    composer.addPass(new RenderPass(escena, camara));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      BLOOM.fuerza, BLOOM.radio, BLOOM.umbral
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const reloj = new THREE.Clock();

    function animar() {
      requestAnimationFrame(animar);
      uTiempo.value += Math.min(reloj.getDelta(), 0.1) * SOL.velocidad; // tope: si la pestaña duerme, no da un salto
      sol.rotation.y -= 0.0008; // mismo sentido que las órbitas

      planetas.forEach((p) => {
        p.angulo += p.velocidad;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.grupo.position.set(x, y, z * Math.cos(p.incl));

        if (p.anclado) {
          p.mesh.lookAt(0, 0, 0);     // misma cara a la estrella
        } else {
          p.mesh.rotation.y -= 0.01;  // rota libre, en el mismo sentido que su órbita (prógrado)
        }

        if (p.luces) {
          // dirección del planeta HACIA la estrella (en el origen)
          p.luces.material.uniforms.dirLuz.value.copy(p.grupo.position).multiplyScalar(-1).normalize();
        }
      });

      // ─── Cámara ───
      if (enfocado) {
        // Plano enfocado CO-MÓVIL en vista de TERMINADOR: vemos algo más de
        // media cara ILUMINADA (geografía) con la línea día/noche y las luces
        // en la mitad oscura. La cámara acompaña al planeta → queda fijo en
        // cuadro; solo se mueven los demás planetas. (El sol queda fuera de
        // cuadro: ver nota — no se puede ver la cara diurna Y el sol a la vez.)
        const pos = enfocado.grupo.position;
        const d = 12.7 * enfocado.r;                  // distancia → el planeta ocupa ~20% de pantalla
        fuera.copy(pos).normalize();                  // sol → planeta (radial)
        lado.crossVectors(ARRIBA, fuera).normalize(); // tangencial (si la mitad iluminada sale al otro lado, invertir el signo de 0.93)
        destino.copy(pos)
          .addScaledVector(fuera, -0.10 * d)          // un pelín hacia el sol → algo más de media cara iluminada
          .addScaledVector(lado,   0.93 * d)          // sobre todo lateral → vista de terminador
          .addScaledVector(ARRIBA, 0.26 * d);         // leve elevación
        controls.enabled = false;
        if (volando) {
          tProg = Math.min(1, tProg + 0.025);
          const e = suavizar(tProg);
          camara.position.lerpVectors(entryPos, destino, e);
          miraFoco.lerpVectors(entryMira, pos, e);
          if (tProg >= 1) volando = false;
        } else {
          camara.position.copy(destino);              // co-móvil: fijo respecto al planeta
          miraFoco.copy(pos);
        }
        camara.lookAt(miraFoco);
      } else if (volando) {
        // Volver a la vista general
        controls.enabled = false;
        tProg = Math.min(1, tProg + 0.02);
        const e = suavizar(tProg);
        camara.position.lerpVectors(entryPos, VISTA_GENERAL, e);
        miraFoco.lerpVectors(entryMira, MIRADA_GENERAL, e);
        camara.lookAt(miraFoco);
        if (tProg >= 1) {
          volando = false;
          controls.target.copy(MIRADA_GENERAL);       // devolver el mando a OrbitControls
        }
      } else {
        controls.enabled = true;                        // vista general libre
        controls.update();
      }

      // ─── Corona: siempre de frente a la cámara ───
      // (va DESPUÉS de mover la cámara, para usar su orientación de este fotograma)
      corona.position.copy(sol.position);
      corona.quaternion.copy(camara.quaternion);
      // Una esfera vista en perspectiva se ve un poco MAYOR que su radio real
      // (vemos su contorno tangente, no su ecuador). uK corrige eso para que el
      // halo empiece justo en el borde visible: D / √(D² − R²).
      const D = camara.position.distanceTo(sol.position);
      uniCorona.uK.value = D / Math.sqrt(Math.max(D * D - RADIO_SOL * RADIO_SOL, 1e-3));

      composer.render();
    }
    animar();

    // ════════════════════════════════════════════════════════════
    //  RESIZE
    // ════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight); // también reajusta el bloom
      encajarFondo();
    });
  </script>
</body>
</html>
