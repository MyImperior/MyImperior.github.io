    // ════════════════════════════════════════════════════════════
    //  MAPEO HÍBRIDO de planetas: imagen envuelta + CASQUETES POLARES
    //
    //  Una imagen rectangular envuelta en una esfera aprieta toda su fila de
    //  arriba en un solo punto → el polo se ve estirado en estrella. Aquí,
    //  cerca de cada polo, en vez de envolver se PROYECTA la imagen desde
    //  arriba (como un proyector de diapositivas apuntando al polo): el dibujo
    //  conserva su forma. La frontera entre las dos zonas es ondulada y suave,
    //  para que no se note un círculo.
    //  (La costura vertical se arregla aparte, en la propia imagen: *-sc.png)
    // ════════════════════════════════════════════════════════════
    const CASQUETE = { desde: 0.72, hasta: 0.86 }; // |seno de la latitud|: empieza ~46°, completo ~59°
    function aplicarCasquetes(material, oscuro = 0) { // oscuro: cuánto se oscurece el casquete (0 = nada)
      material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
          .replace('#include <map_fragment>', `
            #ifdef USE_MAP
              vec3 nObj = normalize(vObjPos);              // punto de la esfera (gira con el planeta)
              vec4 cEnv = texture2D(map, vMapUv);          // imagen envuelta (lo de siempre)
              // Proyección desde arriba. Escala elegida para que 1 píxel de la imagen
              // mida lo mismo que en el ecuador (u: 1/2π, v: 1/π). Cada polo toma la
              // franja de la imagen que ya le corresponde (arriba el norte, abajo el sur).
              float sur = step(nObj.y, 0.0);
              vec2 uvP = vec2(nObj.x * 0.159, nObj.z * 0.318) + mix(vec2(0.5, 0.80), vec2(0.5, 0.20), sur);
              vec4 cPol = texture2D(map, uvP);
              float ang = atan(nObj.z, nObj.x);
              float lat = abs(nObj.y) + 0.035 * sin(ang * 5.0 + sur * 2.0) + 0.02 * sin(ang * 11.0 + 1.3);
              float polo = smoothstep(${CASQUETE.desde.toFixed(3)}, ${CASQUETE.hasta.toFixed(3)}, lat);
              diffuseColor *= mix(cEnv, cPol * ${(1 - oscuro).toFixed(3)}, polo);
            #endif`);
      };
    }

    const planetas = [];

    mundos.forEach((m) => {
      const grupo = new THREE.Group(); // se traslada por la órbita; el mesh rota dentro
      escena.add(grupo);

      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const rEsc = radioEnEscena(m);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(rEsc, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      aplicarCasquetes(mesh.material, m.poloOscuro || 0); // polos sin estirar
      grupo.add(mesh);

      // (sin halo: los planetas se ven como discos reales, a su tamaño)

      // Luces nocturnas pegadas a la superficie (hijas del mesh → rotan con él)
      let luces = null;
      if (m.luces > 0) {
        luces = crearLucesNocturnas(rEsc * 1.0015, m.luces);
        mesh.add(luces);
      }

      const inclRad = m.incl * Math.PI / 180; // (líneas de órbita eliminadas)

      // Velocidades en RADIANES POR SEGUNDO, a partir de los periodos reales.
      // (Antes: 0.005/√dist por fotograma. Eso es la ley de la velocidad LINEAL
      // —v ∝ 1/√d—, no la angular, que va como 1/d^1,5; y además dependía de
      // los fps: en el Chromebook todo orbitaba más despacio.)
      const orb = orbita(m.dist);
      const periodoRot = m.rot === '3:2' ? orb.periodo * 2 / 3 : m.rot; // días ('anclado' → no se usa)
      planetas.push({
        grupo, mesh, luces, m, orb,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 2 * Math.PI * DIAS_POR_SEGUNDO / orb.periodo,
        giro: m.rot === 'anclado' ? 0 : 2 * Math.PI * DIAS_POR_SEGUNDO / periodoRot,
        anclado: m.rot === 'anclado',
        r: rEsc
      });
    });

    // ════════════════════════════════════════════════════════════
    //  FICHA DEL PLANETA + DESCENSO (el juego para entrar en Ciencia)
    //
    //  Al llegar a un planeta aparece su ficha. "Descender" en un planeta
    //  equivocado aborta con el motivo científico; en el bueno se encienden
    //  las luces de todos los mundos, la cámara baja y se entra en la sección.
    // ════════════════════════════════════════════════════════════
    const $ = (id) => document.getElementById(id);
    const fichaEl = $('ficha'), ayudaEl = $('ayuda'), btnDescender = $('descender'), veredictoEl = $('veredicto');
    const num = (x, dec = 2) => x.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: dec });

    function textoRotacion(p) {
      const rot = p.m.rot;
      if (rot === 'anclado') return 'Anclado';
      if (rot === '3:2') return `3:2 · ${num(p.orb.periodo * 2 / 3, 0)} d`;
      if (rot < 2) return `${num(rot * 24, 0)} h`;
      return `${num(rot, 0)} d`;
    }

    function filas(lista) {
      return lista.map(([k, v]) => `<div class="fila"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    }

    function mostrarFicha(p) {
      const f = p.m.ficha;
      const densidad = 5.51 * f.masa / f.radio ** 3;   // g/cm³ (5,51 = densidad de la Tierra)
      const gravedad = f.masa / f.radio ** 2;          // en g terrestres
      $('f-cod').textContent = `Planeta ${p.m.id}`;
      $('f-nombre').textContent = f.nombre;
      $('f-tipo').textContent = f.tipo;
      $('f-datos').innerHTML =
        `<div class="bloque"><h3>Cuerpo</h3>${filas([
          ['Radio', `${num(f.radio)} × Tierra`],
          ['Masa', `${num(f.masa)} × Tierra`],
          ['Densidad', `${num(densidad, 1)} g/cm³`],
          ['Gravedad', `${num(gravedad)} g`],
          ['Magnetismo', f.magnetismo],
          ['Geología', f.geologia]
        ])}</div>` +
        `<div class="bloque"><h3>Órbita</h3>${filas([
          ['Distancia', `${num(p.orb.a, 2)} UA`],
          ['Año', `${num(p.orb.periodo, 0)} d`],
          ['Luz', `${num(p.orb.flujo)} × Tierra`],
          ['Rotación', textoRotacion(p)]
        ])}</div>` +
        `<div class="bloque"><h3>Superficie</h3>${filas([
          ['Temperatura', f.temperatura],
          ['Atmósfera', f.atmosfera],
          ['Agua', f.agua]
        ])}</div>` +
        '';
      fichaEl.classList.remove('abortado');
      veredictoEl.className = ''; veredictoEl.innerHTML = '';
      btnDescender.disabled = false; btnDescender.textContent = 'Descender';
      if (p.abortado) mostrarAborto(p);   // si ya lo intentó antes, se le recuerda por qué no
      fichaEl.scrollTop = 0;
      fichaEl.classList.add('visible');
    }
    function ocultarFicha() { fichaEl.classList.remove('visible'); }

    function mostrarAborto(p) {
      fichaEl.classList.add('abortado');
      btnDescender.disabled = true; btnDescender.textContent = 'Abortado';
      veredictoEl.className = 'mal';
      veredictoEl.innerHTML = `<b>ABORTADO</b>${p.m.ficha.fallo}`;
      fichaEl.scrollTo({ top: fichaEl.scrollHeight, behavior: 'smooth' }); // que se lea el motivo aunque la ficha sea larga
    }

    let descenso = null;   // { t, d0 } mientras dura la secuencia de descenso
    btnDescender.addEventListener('click', () => {
      if (!enfocado || volando || descenso) return;
      if (!enfocado.m.bueno) { enfocado.abortado = true; mostrarAborto(enfocado); return; }
      btnDescender.disabled = true; btnDescender.textContent = 'Descendiendo';
      veredictoEl.className = 'bien';
      veredictoEl.innerHTML = `<b>AUTORIZADO</b>${enfocado.m.ficha.exito}`;
      fichaEl.scrollTo({ top: fichaEl.scrollHeight, behavior: 'smooth' });
      guardarResuelto();
      descenso = { t: 0, d0: camara.position.distanceTo(enfocado.grupo.position) };
    });

    // Secuencia (segundos desde que se pulsa):
    //  0 → 2,5  se encienden las luces de todos los mundos
    //  1,2 → 4,5  la cámara baja hacia el planeta
    //  3,3  fundido a negro · 4,6  entra en la sección Ciencia
    const DESC = { luces: 2.5, bajarDesde: 1.2, bajar: 3.3, fundido: 3.3, salir: 4.6 };
    function pasoDescenso(dt) {
      if (!descenso) return;
      descenso.t += dt;
      const t = descenso.t;
      uEncendido.value = Math.max(uEncendido.value, suavizar(Math.min(1, t / DESC.luces)));
      if (t > DESC.bajarDesde) {
        const e = suavizar(Math.min(1, (t - DESC.bajarDesde) / DESC.bajar));
        const pos = enfocado.grupo.position;
        offGiro.subVectors(camara.position, pos);
        camara.position.copy(pos).add(offGiro.setLength(THREE.MathUtils.lerp(descenso.d0, enfocado.r * 1.25, e)));
      }
      if (t > DESC.fundido) { $('velo').classList.add('on'); ocultarFicha(); }
      if (t > DESC.salir && !descenso.fuera) { descenso.fuera = true; location.href = 'ciencia.html'; }
    }
    // Si se vuelve atrás desde Ciencia, el navegador puede devolver la página
    // congelada (en negro, a media secuencia): se recarga limpia.
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

    // ════════════════════════════════════════════════════════════
    //  INTERACCIÓN: clic → vuela al planeta; clic en vacío → volver
    // ════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const raton = new THREE.Vector2();
    let enfocado = null;   // planeta enfocado (null = vista general)
    let volando = false;   // true mientras la cámara viaja a su destino
    let tProg = 0;                          // progreso de la transición 0→1 (evita el salto al fijar)
    const entryPos  = new THREE.Vector3();  // pose de cámara al arrancar la transición
    const entryMira = new THREE.Vector3();

    // ── Giro con el ratón, con EJE BLOQUEADO ──
    // Para no perder de vista que el sistema gira en un plano:
    //  - Por defecto, arrastrar solo gira en HORIZONTAL (alrededor del eje
    //    vertical: la altura de la cámara no cambia).
    //  - Solo si el gesto empieza CLARAMENTE vertical (casi sin componente
    //    horizontal), ese arrastre cambia SOLO la altura; al soltar, la nueva
    //    altura queda fijada y los siguientes arrastres vuelven a ser horizontales.
    // El eje se decide en los primeros píxeles de cada arrastre y no cambia
    // hasta soltar. Vale igual en la vista general (gira alrededor del centro)
    // y con un planeta fijado (gira alrededor del planeta).
    const GIRO = {
      umbralPx: 8,       // píxeles que hay que mover antes de decidir el eje
      verticalSi: 2.5,   // vertical solo si |dy| > 2,5 × |dx| (a menos de ~22° de la vertical)
      polarMin: THREE.MathUtils.degToRad(5),   // límite de altura: casi encima del polo…
      polarMax: THREE.MathUtils.degToRad(175), // …y casi debajo
      inercia: 6         // cuanto mayor, antes se frena el giro al soltar
    };
    const arrastre = { activo: false, x0: 0, y0: 0, x: 0, y: 0, eje: null, t: 0 };
    const velGiro = { theta: 0, phi: 0 };   // radianes por segundo (inercia al soltar)
    const esf = new THREE.Spherical();
    const offGiro = new THREE.Vector3();

    // Gira la cámara alrededor de 'centro' en esférico (eje vertical del mundo)
    function girarCamara(centro, dTheta, dPhi) {
      offGiro.subVectors(camara.position, centro);
      esf.setFromVector3(offGiro);
      esf.theta += dTheta;
      esf.phi = THREE.MathUtils.clamp(esf.phi + dPhi, GIRO.polarMin, GIRO.polarMax);
      offGiro.setFromSpherical(esf);
      camara.position.copy(centro).add(offGiro);
      camara.lookAt(centro);
    }
    function centroDeGiro() { return enfocado ? enfocado.grupo.position : controls.target; }
    function puedeGirar() { return !volando && !descenso; }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      Object.assign(arrastre, { activo: true, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, eje: null, t: performance.now() });
      velGiro.theta = velGiro.phi = 0;
    });
    window.addEventListener('pointermove', (e) => {
      if (!arrastre.activo || !puedeGirar()) return;
      if (!arrastre.eje) {
        const dx = e.clientX - arrastre.x0, dy = e.clientY - arrastre.y0;
        if (Math.hypot(dx, dy) < GIRO.umbralPx) return;
        arrastre.eje = Math.abs(dy) > GIRO.verticalSi * Math.abs(dx) ? 'y' : 'x';
        arrastre.x = e.clientX; arrastre.y = e.clientY;
      }
      const ahora = performance.now();
      const dts = Math.max((ahora - arrastre.t) / 1000, 1 / 240);
      const escala = 2 * Math.PI / renderer.domElement.clientHeight; // misma sensibilidad que antes
      let dTheta = 0, dPhi = 0;
      if (arrastre.eje === 'x') dTheta = -(e.clientX - arrastre.x) * escala;
      else                      dPhi   = -(e.clientY - arrastre.y) * escala;
      girarCamara(centroDeGiro(), dTheta, dPhi);
      velGiro.theta = 0.6 * velGiro.theta + 0.4 * dTheta / dts;     // velocidad suavizada, para la inercia
      velGiro.phi   = 0.6 * velGiro.phi   + 0.4 * dPhi / dts;
      arrastre.x = e.clientX; arrastre.y = e.clientY; arrastre.t = ahora;
    });
    window.addEventListener('pointerup', () => {
      if (performance.now() - arrastre.t > 80) velGiro.theta = velGiro.phi = 0; // se paró antes de soltar: sin inercia
      arrastre.activo = false;
    });
    // Inercia: al soltar, el giro sigue un poco y se frena (se llama en cada fotograma)
    function inerciaGiro(dt) {
      if (arrastre.activo || volando) return;
      if (Math.abs(velGiro.theta) + Math.abs(velGiro.phi) < 1e-3) return;
      girarCamara(centroDeGiro(), velGiro.theta * dt, velGiro.phi * dt);
      const f = Math.exp(-GIRO.inercia * dt);
      velGiro.theta *= f; velGiro.phi *= f;
    }

    // Zoom con la rueda alrededor del planeta fijado (en la vista general lo hace OrbitControls)
    renderer.domElement.addEventListener('wheel', (e) => {
      if (!enfocado || volando || descenso) return;
      e.preventDefault();
      const c = enfocado.grupo.position;
      offGiro.subVectors(camara.position, c);
      const dist = THREE.MathUtils.clamp(offGiro.length() * Math.pow(1.0015, e.deltaY), enfocado.r * 2.2, enfocado.r * 40);
      camara.position.copy(c).add(offGiro.setLength(dist));
    }, { passive: false });
    const entryUp   = new THREE.Vector3();  // orientación ("arriba") de la cámara al arrancar el vuelo
    const posPrevia = new THREE.Vector3();  // posición del planeta en el fotograma anterior

    const cieloQ0 = new THREE.Quaternion();   // orientación del cielo respecto a la cámara al arrancar el vuelo
    const Q_ID = new THREE.Quaternion();      // = su encuadre original
    function empezarVuelo() {
      if (cielo.parent !== camara) camara.attach(cielo); // re-enganchar sin saltos (conserva dónde estaba)
      cieloQ0.copy(cielo.quaternion);
      volando = true; tProg = 0;
      entryPos.copy(camara.position);
      entryUp.copy(camara.up);
      controls.enabled = false;
      velGiro.theta = velGiro.phi = 0;
    }

    function irAPlaneta(p) {
      if (descenso || p === enfocado) return;
      // Punto de partida del vuelo: desde donde MIRAMOS ahora. Si ya estábamos
      // en un planeta (o volando) es miraFoco; en la vista general, el centro
      // de OrbitControls. (Antes siempre se tomaba éste → el salto al sol.)
      entryMira.copy(enfocado || volando ? miraFoco : controls.target);
      enfocado = p; empezarVuelo(); ocultarFicha(); ayudaEl.classList.add('oculta');
    }

    // Distinguir un clic real de un arrastre de los controles de cámara
    let abajoX = 0, abajoY = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { abajoX = e.clientX; abajoY = e.clientY; });

    window.addEventListener('click', (e) => {
      if (e.target !== renderer.domElement) return; // clic en la ficha (u otro panel), no en la escena
      if (descenso) return;                         // durante el descenso no se atiende nada
      if (Math.hypot(e.clientX - abajoX, e.clientY - abajoY) > 6) return; // fue arrastre, no clic
      raton.x = (e.clientX / window.innerWidth) * 2 - 1;
      raton.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(raton, camara);
      const hit = ray.intersectObjects(planetas.map(p => p.mesh), false);
      if (hit.length) {
        irAPlaneta(planetas.find(pp => pp.mesh === hit[0].object));
      } else if (enfocado) {
        entryMira.copy(miraFoco);
        enfocado = null; empezarVuelo(); ocultarFicha(); ayudaEl.classList.remove('oculta'); // volver a la vista general
      }
    });

    // ── ETIQUETAS (solo con ESCALA_REAL) ──────────────────────────────
    // Un aro y el nombre junto a cada planeta, en HTML encima de la escena.
    // Se ocultan detrás de la cámara, tapadas por la estrella, la del planeta
    // en el que estás y durante el descenso. Pinchar una = ir a ese planeta.
    const etiquetas = [];
    if (ESCALA_REAL) {
      const cont = $('etiquetas');
      for (const p of planetas) {
        const el = document.createElement('div');
        el.className = 'etq';
        el.innerHTML = `<span class="aro"></span><span class="txt">${p.m.ficha.nombre}</span>`;
        el.addEventListener('click', (e) => { e.stopPropagation(); irAPlaneta(p); });
        cont.appendChild(el);
        etiquetas.push({ p, el });
      }
    }
    const vEtq = new THREE.Vector3(), aCam = new THREE.Vector3();
    function actualizarEtiquetas() {
      if (!etiquetas.length) return;
      const ancho = window.innerWidth, alto = window.innerHeight;
      for (const { p, el } of etiquetas) {
        const pos = p.grupo.position;
        vEtq.copy(pos).project(camara);
        let oculta = !!descenso || p === enfocado || vEtq.z > 1 || Math.abs(vEtq.x) > 1.1 || Math.abs(vEtq.y) > 1.1;
        if (!oculta) {
          // ¿la estrella (esfera en el origen) se interpone entre la cámara y el planeta?
          aCam.subVectors(pos, camara.position);
          const dPl = aCam.length(); aCam.divideScalar(dPl);
          const tca = -camara.position.dot(aCam);
          const d2 = camara.position.lengthSq() - tca * tca;
          if (tca > 0 && tca < dPl && d2 < RADIO_SOL * RADIO_SOL) oculta = true;
        }
        el.classList.toggle('fuera', oculta);
        if (!oculta) el.style.transform = `translate(${((vEtq.x + 1) / 2 * ancho).toFixed(1)}px, ${((1 - vEtq.y) / 2 * alto).toFixed(1)}px)`;
      }
    }

    // ════════════════════════════════════════════════════════════
    //  BUCLE
    // ════════════════════════════════════════════════════════════
    const fuera    = new THREE.Vector3();
    const lado     = new THREE.Vector3();
    const destino  = new THREE.Vector3();
    const miraFoco = new THREE.Vector3();
    const ARRIBA   = new THREE.Vector3(0, 1, 0);
    const delta    = new THREE.Vector3();

    // Duración de los vuelos en SEGUNDOS (igual en cualquier ordenador, vaya a los fps que vaya)
    const VUELO = { ir: 1.4, volver: 1.6 };

    function suavizar(t) { return t * t * (3 - 2 * t); } // smoothstep para transiciones

    const reloj = new THREE.Clock();
    const haciaCam = new THREE.Vector3();

    function animar() {
      requestAnimationFrame(animar);
      const dt = Math.min(reloj.getDelta(), 0.1); // segundos desde el fotograma anterior (tope: si la pestaña duerme, no da un salto)
      uTiempo.value += dt * SOL.velocidad;
      sol.rotation.y -= SOL.giro * dt; // por segundos, no por fotogramas: igual en el Chromebook que en el PC
      actualizarProtuberancias();
      actualizarBucles();
      actualizarBuclesBorde(dt);
      uAltoPant.value = renderer.domElement.height;

      planetas.forEach((p) => {
        p.angulo += p.velocidad * dt;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.grupo.position.set(x, y, z * Math.cos(p.incl));

        if (p.anclado) {
          p.mesh.lookAt(0, 0, 0);     // misma cara a la estrella
        } else {
          p.mesh.rotation.y -= p.giro * dt;  // rota, en el mismo sentido que su órbita (prógrado)
        }

        if (p.luces) {
          // dirección del planeta HACIA la estrella (en el origen)
          p.luces.material.uniforms.dirLuz.value.copy(p.grupo.position).multiplyScalar(-1).normalize();
        }
      });

      // ─── Cámara ───
      if (enfocado) {
        // Al LLEGAR: vista de TERMINADOR (algo más de media cara iluminada, la
        // línea día/noche y las luces en la mitad oscura). Después, el ratón
        // gira libremente alrededor del planeta, que la cámara acompaña.
        const pos = enfocado.grupo.position;
        const d = 12.7 * enfocado.r;                  // distancia → el planeta ocupa ~20% de pantalla
        fuera.copy(pos).normalize();                  // sol → planeta (radial)
        lado.crossVectors(ARRIBA, fuera).normalize(); // tangencial (si la mitad iluminada sale al otro lado, invertir el signo de 0.93)
        destino.copy(pos)
          .addScaledVector(fuera, -0.10 * d)          // un pelín hacia el sol → algo más de media cara iluminada
          .addScaledVector(lado,   0.93 * d)          // sobre todo lateral → vista de terminador
          .addScaledVector(ARRIBA, 0.26 * d);         // leve elevación
        controls.enabled = false;
        if (volando) {
          tProg = Math.min(1, tProg + dt / VUELO.ir);
          const e = suavizar(tProg);
          camara.position.lerpVectors(entryPos, destino, e);
          miraFoco.lerpVectors(entryMira, pos, e);
          camara.up.lerpVectors(entryUp, ARRIBA, e).normalize(); // si veníamos girados, enderezar
          camara.lookAt(miraFoco);
          cielo.quaternion.slerpQuaternions(cieloQ0, Q_ID, e);   // el cielo vuelve a su encuadre
          cielo.position.set(0, 0, 0);
          if (tProg >= 1) {
            // Llegada: el mando pasa al giro libre alrededor del planeta
            volando = false;
            posPrevia.copy(pos);
            camara.updateMatrixWorld();
            escena.attach(cielo);  // soltar el cielo: queda fijo en el espacio
            mostrarFicha(enfocado);
          }
        } else {
          // CO-MÓVIL: la cámara se desplaza lo mismo que el planeta en su órbita
          // → el planeta queda quieto en cuadro; el ratón gira alrededor de él.
          camara.position.add(delta.subVectors(pos, posPrevia));
          posPrevia.copy(pos);
          inerciaGiro(dt);
          pasoDescenso(dt);
          camara.lookAt(pos);
          miraFoco.copy(pos);
          cielo.position.copy(camara.position); // el cielo acompaña a la cámara en posición (está "en el infinito"), no en giro
        }
      } else if (volando) {
        // Volver a la vista general
        controls.enabled = false;
        tProg = Math.min(1, tProg + dt / VUELO.volver);
        const e = suavizar(tProg);
        camara.position.lerpVectors(entryPos, VISTA_GENERAL, e);
        miraFoco.lerpVectors(entryMira, MIRADA_GENERAL, e);
        camara.up.lerpVectors(entryUp, ARRIBA, e).normalize(); // enderezar
        camara.lookAt(miraFoco);
        cielo.quaternion.slerpQuaternions(cieloQ0, Q_ID, e);     // el cielo vuelve a su encuadre
        cielo.position.set(0, 0, 0);
        if (tProg >= 1) {
          volando = false;
          camara.up.copy(ARRIBA);
          controls.target.copy(MIRADA_GENERAL);       // devolver el mando a OrbitControls
        }
      } else {
        controls.enabled = true;                        // vista general: zoom y desplazamiento (OrbitControls)
        inerciaGiro(dt);                                // giro: el propio, de eje bloqueado
        controls.update();
      }

      // ─── Borde (espículas) y halo (después de mover la cámara) ───
      haloSol.position.copy(sol.position);
      const D = camara.position.distanceTo(sol.position);
      // El contorno que vemos NO es el ecuador de la esfera: es un círculo
      // tangente, algo por delante del centro (a R²/D) y algo menor (R/uK).
      // El plano se coloca ahí, perpendicular a la línea sol→cámara.
      uniCorona.uK.value = D / Math.sqrt(Math.max(D * D - RADIO_SOL * RADIO_SOL, 1e-3));
      haciaCam.subVectors(camara.position, sol.position).normalize();
      corona.position.copy(sol.position).addScaledVector(haciaCam, RADIO_SOL * RADIO_SOL / D);
      corona.up.set(0, 1, 0).applyQuaternion(camara.quaternion); // mismo "arriba" que la cámara (sin giros raros)
      corona.lookAt(camara.position);
      // radio aparente del sol en píxeles (para apagar las espículas cuando son menores que un píxel)
      const angSol = Math.asin(Math.min(RADIO_SOL / D, 1));
      uniCorona.uRadioPx.value = Math.tan(angSol) / Math.tan(THREE.MathUtils.degToRad(camara.fov / 2)) * window.innerHeight / 2;
      // ─── Grano: aparece al acercarse ───
      uGrano.value = 1 - THREE.MathUtils.smoothstep(D, SOL.granoPleno, SOL.granoDesde);

      actualizarEtiquetas();
      // Plano de corte cercano: con planetas diminutos la cámara se pone muy
      // cerca de la superficie; si no se acerca también, el planeta se "corta".
      const cerca = enfocado
        ? THREE.MathUtils.clamp((camara.position.distanceTo(enfocado.grupo.position) - enfocado.r) * 0.5, 0.002, 0.1)
        : 0.1;
      if (Math.abs(cerca - camara.near) > 1e-4) { camara.near = cerca; camara.updateProjectionMatrix(); }

      renderer.render(escena, camara);
    }
    animar();

    // ════════════════════════════════════════════════════════════
    //  RESIZE
    // ════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      encajarFondo();
    });
  </script>
</body>
</html>
