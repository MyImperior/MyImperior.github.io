<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema planetario — vista a escala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #05060a; }
    canvas { display: block; }
    #ayuda {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #8fa0b5; font: 12px/1.4 Arial, sans-serif; letter-spacing: .08em;
      text-transform: uppercase; opacity: .6; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="ayuda">Pincha un mundo para acercarte · pincha el vacío para volver</div>

  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ════════════════════════════════════════════════════════════
    //  RENDERER / ESCENA / CÁMARA
    // ════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x05060a); // fondo por defecto hasta que llegue la nebulosa

    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 6000);

    // VISTA GENERAL del sistema. Cámara a distancia ~34 (entre la 5ª y la 6ª
    // órbita). Los planetas exteriores entran y salen de plano al orbitar.
    // Ajusta estos tres números por ojo para alejar/acercar.
    const VISTA_GENERAL   = new THREE.Vector3(0, 16, 31);
    const MIRADA_GENERAL  = new THREE.Vector3(0, 0, 0);
    camara.position.copy(VISTA_GENERAL);
    const miraActual = MIRADA_GENERAL.clone(); // objetivo de lookAt que interpolamos
    camara.lookAt(miraActual);
    escena.add(camara); // necesario para que las estrellas (hijas de la cámara) se rendericen

    const cargador = new THREE.TextureLoader();

    // ════════════════════════════════════════════════════════════
    //  FONDO: campo de estrellas procedural + nebulosa opcional
    // ════════════════════════════════════════════════════════════
    (function campoEstrellas() {
      const N = 2500;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const R = 2500;
        pos[i*3]   = R * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = R * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = R * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false });
      const estrellas = new THREE.Points(geo, mat);
      camara.add(estrellas); // hijas de la cámara → cielo fijo en pantalla, no barre al girar/volar
    })();

    // Fondo PLANO encajado a la pantalla (tipo "cover"): nítido y bien
    // compuesto, sin envolver 360° (que repartía la imagen y la difuminaba).
    let texFondo = null;
    function encajarFondo() {
      if (!texFondo || !texFondo.image) return;
      const aImg = texFondo.image.width / texFondo.image.height;
      const aPant = window.innerWidth / window.innerHeight;
      if (aPant > aImg) {                 // pantalla más ancha → ajusto ancho, recorto alto
        texFondo.repeat.set(1, aImg / aPant);
        texFondo.offset.set(0, (1 - aImg / aPant) / 2);
      } else {                            // pantalla más alta → ajusto alto, recorto ancho
        texFondo.repeat.set(aPant / aImg, 1);
        texFondo.offset.set((1 - aPant / aImg) / 2, 0);
      }
    }
    cargador.load(
      '../imagenes/sistema/fondo-espacio.png',
      (t) => {
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texFondo = t;
        escena.background = t;
        encajarFondo();
      },
      undefined,
      () => { /* sin imagen aún: se queda el color + estrellas procedurales */ }
    );

    // ════════════════════════════════════════════════════════════
    //  TEXTURA "GLOW" (halo radial) para que cada planeta se lea
    //  como un PUNTO de color desde lejos.
    // ════════════════════════════════════════════════════════════
    function texturaGlow() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const TEX_GLOW = texturaGlow();

    // ════════════════════════════════════════════════════════════
    //  ESTRELLA K (naranja). Lista para textura (imagenes/sistema/sol.png).
    //  Ahora MUCHO mayor que los planetas (una estrella empequeñece a
    //  cualquier mundo). La luz sale de su centro.
    // ════════════════════════════════════════════════════════════
    const RADIO_SOL = 6.0;
    const matSol = new THREE.MeshBasicMaterial({ color: 0xffb066 });
    cargador.load(
      '../imagenes/sistema/sol.png',
      // color por debajo de blanco → atenúa la textura (menos intenso, más de estrella). Ajustable.
      (t) => { t.colorSpace = THREE.SRGBColorSpace; matSol.map = t; matSol.color.set(0xb89a72); matSol.needsUpdate = true; },
      undefined,
      () => {}
    );
    const sol = new THREE.Mesh(new THREE.SphereGeometry(RADIO_SOL, 64, 64), matSol);
    escena.add(sol);

    const haloSol = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, color: 0xffcc88, opacity: 0.55, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    haloSol.scale.setScalar(RADIO_SOL * 4.5);
    escena.add(haloSol);

    const luzSol = new THREE.PointLight(0xffd9a0, 4, 3000, 0.08);
    escena.add(luzSol);
    escena.add(new THREE.AmbientLight(0x223044, 0.45));

    // ════════════════════════════════════════════════════════════
    //  LUCES NOCTURNAS (tecnomarcadores)
    //  - num: cantidad (más en mundos habitables, pocas en los demás)
    //  - puntos PEGADOS a la superficie, finos y tenues.
    // ════════════════════════════════════════════════════════════
    function crearLucesNocturnas(radio, num) {
      const p = new Float32Array(num * 3);
      for (let i = 0; i < num; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        p[i*3]   = radio * Math.sin(phi) * Math.cos(theta);
        p[i*3+1] = radio * Math.sin(phi) * Math.sin(theta);
        p[i*3+2] = radio * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      const mat = new THREE.ShaderMaterial({
        uniforms: { dirLuz: { value: new THREE.Vector3(1, 0, 0) } },
        vertexShader: `
          uniform vec3 dirLuz;
          varying float visibilidad;
          void main() {
            vec3 normalMundo = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            float cara = dot(normalMundo, dirLuz);      // >0 día, <0 noche
            visibilidad = smoothstep(0.05, -0.25, cara); // solo de noche
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 1.3;                          // más finas
          }
        `,
        fragmentShader: `
          varying float visibilidad;
          void main() {
            if (visibilidad < 0.01) discard;
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            gl_FragColor = vec4(1.0, 0.8, 0.45, visibilidad * 0.55); // más tenue
          }
        `,
        transparent: true,
        depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    // ════════════════════════════════════════════════════════════
    //  LOS MUNDOS  (ordenados por lógica térmica: del más caliente,
    //  pegado a la estrella, al más frío en el exterior)
    //
    //  r       radio (relaciones realistas: rocosos pequeños, gigante
    //          gaseoso mucho mayor, pero todos muy por debajo del sol)
    //  dist    distancia orbital
    //  incl    inclinación de la órbita (grados)
    //  color   color del punto visto de lejos
    //  luces   nº de luces de ciudad (0 = sin superficie habitada)
    //  anclado anclaje por marea. Con estrella K sólo los interiores
    //          suelen anclarse; los de la zona habitable y exteriores, no.
    // ════════════════════════════════════════════════════════════
    const mundos = [
      { tex: '5-lava.png',      r: 0.35, dist: 12, incl: 0,  color: 0xd1552e, luces: 30,  anclado: true  }, // magmático, el más interior
      { tex: '2-desertica.png', r: 0.45, dist: 16, incl: 0,  color: 0xc88a4a, luces: 120, anclado: true  }, // desértico, caliente y seco
      { tex: '8-roca.png',      r: 0.30, dist: 20, incl: 14, color: 0x8a7f72, luces: 60,  anclado: false }, // rocoso desplazado (órbita inclinada)
      { tex: '1-islas.png',     r: 0.50, dist: 26, incl: 0,  color: 0x6fae7a, luces: 650, anclado: false }, // archipiélagos — zona habitable
      { tex: '4-templado.png',  r: 0.55, dist: 31, incl: 0,  color: 0x7bbf8f, luces: 550, anclado: false }, // templado — zona habitable
      { tex: '7-estepa.png',    r: 0.45, dist: 38, incl: 0,  color: 0x9fae73, luces: 150, anclado: false }, // estepa, más frío
      { tex: '3-helado.png',    r: 0.40, dist: 46, incl: 0,  color: 0xaccadf, luces: 40,  anclado: false }, // helado, exterior
      { tex: '6-gaseoso1.png',  r: 1.40, dist: 58, incl: 0,  color: 0xb79a6e, luces: 0,   anclado: false }  // gigante gaseoso — sin superficie, sin luces
    ];

    const planetas = [];

    mundos.forEach((m) => {
      const grupo = new THREE.Group(); // se traslada por la órbita; el mesh rota dentro
      escena.add(grupo);

      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      grupo.add(mesh);

      // (sin halo: los planetas se ven como discos reales, a su tamaño)

      // Luces nocturnas pegadas a la superficie (hijas del mesh → rotan con él)
      let luces = null;
      if (m.luces > 0) {
        luces = crearLucesNocturnas(m.r * 1.0015, m.luces);
        mesh.add(luces);
      }

      // Órbita visible, inclinada — MUY fina/tenue (se quitará en la versión final)
      const inclRad = m.incl * Math.PI / 180;
      const pts = [];
      for (let i = 0; i <= 160; i++) {
        const a = (i / 160) * Math.PI * 2;
        const x = Math.cos(a) * m.dist;
        const z = Math.sin(a) * m.dist;
        const y = Math.sin(a) * m.dist * Math.sin(inclRad);
        pts.push(new THREE.Vector3(x, y, z * Math.cos(inclRad)));
      }
      const orbita = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x1c2630, transparent: true, opacity: 0.18 })
      );
      escena.add(orbita);

      planetas.push({
        grupo, mesh, luces,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 0.005 / Math.sqrt(m.dist), // 25% de la velocidad original
        anclado: m.anclado,
        r: m.r
      });
    });

    // ════════════════════════════════════════════════════════════
    //  INTERACCIÓN: clic → vuela al planeta; clic en vacío → volver
    // ════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const raton = new THREE.Vector2();
    let planetaEnfocado = null;

    window.addEventListener('click', (e) => {
      raton.x = (e.clientX / window.innerWidth) * 2 - 1;
      raton.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(raton, camara);
      const dianas = planetas.map(p => p.mesh);
      const hit = ray.intersectObjects(dianas, false);
      if (hit.length) {
        planetaEnfocado = planetas.find(p => p.mesh === hit[0].object);
      } else {
        planetaEnfocado = null;
      }
    });

    // ════════════════════════════════════════════════════════════
    //  ZOOM con la rueda del ratón (funciona en vista general y enfocado)
    // ════════════════════════════════════════════════════════════
    let factorZoom = 1;
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      factorZoom *= (e.deltaY > 0) ? 1.1 : 0.9;   // rueda arriba = acercar
      factorZoom = THREE.MathUtils.clamp(factorZoom, 0.25, 4);
    }, { passive: false });

    // ════════════════════════════════════════════════════════════
    //  BUCLE
    // ════════════════════════════════════════════════════════════
    const objetivoPos = new THREE.Vector3();
    const objetivoMira = new THREE.Vector3();
    const fuera = new THREE.Vector3();
    const ARRIBA = new THREE.Vector3(0, 1, 0);

    function animar() {
      requestAnimationFrame(animar);
      sol.rotation.y += 0.0008;
      haloSol.position.copy(sol.position);

      planetas.forEach((p) => {
        p.angulo += p.velocidad;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.grupo.position.set(x, y, z * Math.cos(p.incl));

        if (p.anclado) {
          p.mesh.lookAt(0, 0, 0);     // misma cara a la estrella
        } else {
          p.mesh.rotation.y += 0.01;  // rota libre
        }

        if (p.luces) {
          // dirección del planeta HACIA la estrella (en el origen)
          p.luces.material.uniforms.dirLuz.value.copy(p.grupo.position).multiplyScalar(-1).normalize();
        }
      });

      // Cámara: al planeta enfocado (por FUERA de la órbita y ELEVADA,
      // así el sol nunca se interpone entre cámara y planeta) o a la vista general.
      if (planetaEnfocado) {
        const pos = planetaEnfocado.grupo.position;
        const r = planetaEnfocado.r;
        fuera.copy(pos).normalize();                        // radial: del sol hacia el planeta
        objetivoPos.copy(pos)
          .addScaledVector(fuera, (r * 5 + 3) * factorZoom) // nos apartamos hacia fuera (con zoom)
          .addScaledVector(ARRIBA, (r * 6 + 4) * factorZoom); // y por encima (vista cenital)
        objetivoMira.copy(pos);
      } else {
        objetivoPos.copy(VISTA_GENERAL).multiplyScalar(factorZoom); // vista general + zoom
        objetivoMira.copy(MIRADA_GENERAL);
      }
      camara.position.lerp(objetivoPos, 0.05);
      miraActual.lerp(objetivoMira, 0.05);
      camara.lookAt(miraActual);

      renderer.render(escena, camara);
    }
    animar();

    // ════════════════════════════════════════════════════════════
    //  RESIZE
    // ════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      encajarFondo();
    });
  </script>
</body>
</html>
