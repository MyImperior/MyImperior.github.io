<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema planetario habitado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

    // ─── POSICIÓN DE CÁMARA (ajustable por ojo) ───
    const CAM_DISTANCIA = 42;
    const CAM_ALTURA_GRADOS = 30;
    const CAM_RELOJ_GRADOS = 120;
    const altRad = CAM_ALTURA_GRADOS * Math.PI / 180;
    const relRad = CAM_RELOJ_GRADOS * Math.PI / 180;
    camara.position.set(
      CAM_DISTANCIA * Math.cos(altRad) * Math.cos(relRad),
      CAM_DISTANCIA * Math.sin(altRad),
      CAM_DISTANCIA * Math.cos(altRad) * Math.sin(relRad)
    );
    camara.lookAt(0, 0, 0);

    const cargador = new THREE.TextureLoader();

    // ─── ESTRELLA K (naranja, provisional color plano) ───
    const sol = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffcc66 })
    );
    sol.position.set(0, 0, 0);
    escena.add(sol);
    // halo para que el sol "brille" y no sea una bola plana
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(4.2, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff9933, transparent: true, opacity: 0.25, side: THREE.BackSide })
    );
    escena.add(halo);
    const luzSol = new THREE.PointLight(0xfff0dd, 4, 400, 0.15);
    escena.add(luzSol);
    escena.add(new THREE.AmbientLight(0x334455, 0.5));

    // ─── LOS 8 MUNDOS ───
    // textura, radio, distancia orbital, e inclinacion de orbita (grados).
    // El 8 (roca) lleva inclinacion → el "desplazado por colision".
    const mundos = [
      { tex: '1-islas.png',     r: 0.9,  dist: 7,    incl: 0 },
      { tex: '2-desertica.png', r: 1.0,  dist: 9.5,  incl: 0 },
      { tex: '3-helado.png',    r: 0.85, dist: 12,   incl: 0 },
      { tex: '4-templado.png',  r: 1.1,  dist: 15,   incl: 0 },
      { tex: '5-lava.png',      r: 0.8,  dist: 18,   incl: 0 },
      { tex: '8-roca.png',      r: 0.7,  dist: 21,   incl: 14 },  // desplazado
      { tex: '6-gaseoso1.png',  r: 2.2,  dist: 26,   incl: 0 },   // gigante guardian
      { tex: '7-estepa.png',    r: 1.0,  dist: 31,   incl: 0 }
    ];

    const planetas = [];

    mundos.forEach((m) => {
      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      escena.add(mesh);

      // Grupo de inclinacion: rota el plano de la orbita
      const inclRad = m.incl * Math.PI / 180;

      // Orbita visible, inclinada
      const puntos = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        const x = Math.cos(a) * m.dist;
        const z = Math.sin(a) * m.dist;
        const y = Math.sin(a) * m.dist * Math.sin(inclRad); // inclinacion
        puntos.push(new THREE.Vector3(x, y, z * Math.cos(inclRad)));
      }
      const orbita = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(puntos),
        new THREE.LineBasicMaterial({ color: 0x2a3a4a })
      );
      escena.add(orbita);

      planetas.push({
        mesh,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 0.02 / Math.sqrt(m.dist)
      });
    });

    // ─── BUCLE ───
    function animar() {
      requestAnimationFrame(animar);
      sol.rotation.y += 0.001;

      planetas.forEach((p) => {
        p.angulo += p.velocidad;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.mesh.position.set(x, y, z * Math.cos(p.incl));
        p.mesh.rotation.y += 0.01;
      });

      renderer.render(escena, camara);
    }
    animar();

    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
