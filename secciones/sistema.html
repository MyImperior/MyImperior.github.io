<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema planetario — vista a escala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #05060a; }
    canvas { display: block; }
    #ayuda {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #8fa0b5; font: 12px/1.4 Arial, sans-serif; letter-spacing: .08em;
      text-transform: uppercase; opacity: .6; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="ayuda">Pincha un mundo para acercarte · arrastra para girar a su alrededor · pincha el vacío para volver</div>

  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

    // ════════════════════════════════════════════════════════════
    //  RENDERER / ESCENA / CÁMARA
    // ════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x05060a); // negro espacial detrás de la nebulosa

    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 6000);

    // VISTA GENERAL del sistema: alejada para que la órbita exterior (~58)
    // pase justo por delante. Ajusta estos tres números por ojo.
    const VISTA_GENERAL   = new THREE.Vector3(0, 28, 62);
    const MIRADA_GENERAL  = new THREE.Vector3(0, 0, 0);
    camara.position.copy(VISTA_GENERAL);
    camara.lookAt(MIRADA_GENERAL);
    escena.add(camara); // necesario para que el cielo (hijo de la cámara) se renderice

    // Controles de cámara libres: arrastrar = girar, rueda = zoom, botón derecho = desplazar
    const controls = new OrbitControls(camara, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 12; // = 2 × radio del sol: impide meter la cámara DENTRO de la estrella
    controls.maxDistance = 400;
    controls.target.copy(MIRADA_GENERAL);
    controls.update();

    const cargador = new THREE.TextureLoader();

    // ════════════════════════════════════════════════════════════
    //  CIELO: estrellas + nebulosa, reunidas en un grupo "cielo"
    //
    //  - Vista general: el cielo va pegado a la cámara (fijo en pantalla, no
    //    barre al girar; decisión anterior que se mantiene).
    //  - Planeta fijado: el cielo se SUELTA y queda fijo en el espacio; al
    //    girar alrededor del planeta, estrellas y nebulosa pasan por la
    //    pantalla como pasarían de verdad.
    //  - Al volar de nuevo, se vuelve a enganchar a la cámara y se recoloca
    //    suavemente en su encuadre original durante el vuelo.
    // ════════════════════════════════════════════════════════════
    const cielo = new THREE.Group();
    camara.add(cielo);

    (function campoEstrellas() {
      const N = 2500;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const R = 2500;
        pos[i*3]   = R * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = R * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = R * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false });
      cielo.add(new THREE.Points(geo, mat));
    })();

    // NEBULOSA: imagen en un plano lejano dentro del cielo. En la vista general
    // ocupa la pantalla exactamente igual que antes (encaje "cover"). El plano es
    // MAYOR que la pantalla (MARGEN_NEB) y por fuera de ella la imagen continúa
    // en espejo y se desvanece a negro: así, al girar, no aparece un borde recto.
    const DIST_NEB = 3000;   // detrás de las estrellas (2500), antes del límite de la cámara (6000)
    const MARGEN_NEB = 1.6;  // el plano mide 1,6 veces la pantalla
    const uniNeb = {
      map:  { value: null },
      uRep: { value: new THREE.Vector2(1, 1) },
      uOff: { value: new THREE.Vector2(0, 0) },
      uK:   { value: MARGEN_NEB }
    };
    const nebulosa = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.ShaderMaterial({
        uniforms: uniNeb,
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: `
          uniform sampler2D map;
          uniform vec2 uRep, uOff;
          uniform float uK;
          varying vec2 vUv;
          void main() {
            vec2 s = (vUv - 0.5) * uK + 0.5;      // 0..1 = la zona que ocupa la pantalla
            vec3 col = texture2D(map, s * uRep + uOff).rgb;
            float fuera = max(max(-s.x, s.x - 1.0), max(-s.y, s.y - 1.0)); // >0 fuera de la pantalla
            float a = 1.0 - smoothstep(0.0, (uK - 1.0) * 0.5, fuera);
            gl_FragColor = vec4(col, a);
          }
        `,
        transparent: true,
        depthWrite: false
      })
    );
    nebulosa.position.z = -DIST_NEB;
    nebulosa.visible = false; // hasta que cargue la imagen
    cielo.add(nebulosa);

    function encajarFondo() {
      // tamaño del plano: 1,6 veces lo que abarca la pantalla a esa distancia
      const alto = 2 * DIST_NEB * Math.tan(THREE.MathUtils.degToRad(camara.fov / 2));
      const aPant = window.innerWidth / window.innerHeight;
      nebulosa.scale.set(alto * aPant * MARGEN_NEB, alto * MARGEN_NEB, 1);
      const t = uniNeb.map.value;
      if (!t || !t.image) return;
      const aImg = t.image.width / t.image.height;
      if (aPant > aImg) {                 // pantalla más ancha → ajusto ancho, recorto alto
        uniNeb.uRep.value.set(1, aImg / aPant);
        uniNeb.uOff.value.set(0, (1 - aImg / aPant) / 2);
      } else {                            // pantalla más alta → ajusto alto, recorto ancho
        uniNeb.uRep.value.set(aPant / aImg, 1);
        uniNeb.uOff.value.set((1 - aPant / aImg) / 2, 0);
      }
    }
    cargador.load(
      '../imagenes/sistema/fondo-espacio.png',
      (t) => {
        // (sin colorSpace: se usan los valores de la imagen tal cual → mismo color que antes)
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; // fuera de la imagen, continúa en espejo
        uniNeb.map.value = t;
        nebulosa.visible = true;
        encajarFondo();
      },
      undefined,
      () => { /* sin imagen: se queda el color + estrellas procedurales */ }
    );
    encajarFondo();

    // ════════════════════════════════════════════════════════════
    //  ESTRELLA K — "vista con filtro solar" (luz visible)
    //
    //  Concepto acordado: lo que vería un observador con un filtro solar,
    //  sin deslumbramiento. Un disco TRANQUILO:
    //   - oscurecimiento del borde (lo que lo hace leerse como bola de gas)
    //   - granulación: invisible de lejos (cada gránulo es menor que un
    //     píxel); aparece y se ve hervir al ACERCARSE
    //   - manchas de contraste real (pardas, no negras) y fáculas junto al borde
    //   - borde nítido
    //  Licencias artísticas: halo cálido alrededor y protuberancias que nacen
    //  y mueren por toda la superficie y giran con el sol.
    //
    //  Los colores que se escriben aquí son los que se VEN en pantalla.
    // ════════════════════════════════════════════════════════════
    const RADIO_SOL = 6.0;

    // ── MANDOS DEL SOL (ajustar a ojo) ─────────────────────────────
    const SOL = {
      colorCentro:   '#ffdca2', // color en el centro del disco
      colorBorde:    '#cf5a20', // color hacia el borde (capas más altas y frías)
      oscurecimiento: 0.30,     // oscurecimiento del borde. En luz blanca: 0.75 ≈ estrella K, 0.6 ≈ Sol.
                                //   En H-alfa casi no hay (0.3 = elección de Marcos, como sus fotos de referencia)
      grano:         1.0,       // contraste de la granulación al acercarse (0 = sin grano)
      granoDesde:    30,        // distancia a la que el grano empieza a verse
      granoPleno:    18,        // distancia a la que se ve del todo (la cámara llega a 12)
      manchas:       1.0,       // contraste de las manchas de cerca (1 = real)
      manchasLejos:  0.4,       // fracción de ese contraste que queda de lejos (se atenúan con el grano)
      numGrupos:     5,         // grupos de manchas (líder + seguidora + poro), máximo 6
      halo:          1.0,       // brillo del halo (gradiente suave, el de la primera versión)
      espiculas:     1.0,       // chorros finos de plasma en el borde (0 = borde limpio)
      protuberancias: 1.0,      // brillo de las protuberancias (0 = ninguna)
      numProtuberancias: 6,     // cuántas existen repartidas por el sol (no todas se ven)
      giro:          0.048,     // giro del sol (radianes por segundo): 0.048 = una vuelta en ~2 min 10 s
      velocidad:     1.0        // ritmo al que hierve el grano y evolucionan las cosas
    };

    // Ruido simplex 3D (Ian McEwan / Ashima Arts, licencia MIT).
    // Devuelve un valor suave entre -1 y 1 para cualquier punto 3D.
    const RUIDO_GLSL = `
      vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+10.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g  = step(x0.yzx, x0.xyz);
        vec3 l  = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                   i.z + vec4(0.0, i1.z, i2.z, 1.0))
                 + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                 + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j  = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x  = x_ * ns.x + ns.yyyy;
        vec4 y  = y_ * ns.x + ns.yyyy;
        vec4 h  = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 105.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }
      // fbm = varias capas de ruido a escalas cada vez más finas (como una costa:
      // bahías grandes, calas, rocas). 3 capas para lo barato, 5 para lo visible.
      float fbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a*snoise(p); p *= 2.03; a *= 0.5; } return s; }
      float fbm5(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*snoise(p); p *= 2.03; a *= 0.5; } return s; }
    `;

    // Uniforms compartidos
    const uTiempo = { value: 0 };
    const uGrano  = { value: 0 }; // 0 lejos · 1 cerca (lo calcula el bucle según la distancia)

    // ── MANCHAS: posiciones reales ─────────────────────────────────
    // Grupos BIPOLARES: líder grande + seguidora menor (detrás en longitud y
    // algo más hacia el polo: ley de Joy) + un poro. Latitudes de ~8° a ~30°.
    const MAX_MANCHAS = 18;
    const manchas = [];
    function dirLatLon(lat, lon) {
      return new THREE.Vector3(Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon));
    }
    for (let g = 0; g < Math.min(SOL.numGrupos, MAX_MANCHAS / 3); g++) {
      const hem = Math.random() < 0.5 ? 1 : -1;
      const lat = hem * (8 + Math.random() * 22) * Math.PI / 180;
      const lon = g === 0 ? Math.PI / 2 + 0.25 : Math.random() * Math.PI * 2; // el 1er grupo, de cara al llegar
      const tam = 0.0525 + Math.random() * 0.0375; // 25 % menores que antes
      const sep = 0.12 + Math.random() * 0.08;
      const lider     = dirLatLon(lat, lon);
      const seguidora = dirLatLon(lat + hem * 0.03, lon - sep);
      const poro      = dirLatLon(lat + hem * 0.015 + (Math.random() - 0.5) * 0.05, lon - sep * (0.4 + Math.random() * 0.3));
      manchas.push(new THREE.Vector4(lider.x, lider.y, lider.z, tam));
      manchas.push(new THREE.Vector4(seguidora.x, seguidora.y, seguidora.z, tam * (0.5 + Math.random() * 0.2)));
      manchas.push(new THREE.Vector4(poro.x, poro.y, poro.z, tam * 0.22));
    }
    while (manchas.length < MAX_MANCHAS) manchas.push(new THREE.Vector4(0, 1, 0, 0));

    // Leer el hex TAL CUAL (THREE.Color lo convertiría a espacio lineal y saldría oscuro)
    function vec3DeHex(hex) { const n = parseInt(hex.slice(1), 16); return new THREE.Vector3((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); }

    // ── 1) FOTOSFERA ───────────────────────────────────────────────
    const matSol = new THREE.ShaderMaterial({
      uniforms: {
        uTiempo, uGrano,
        uCentro:   { value: vec3DeHex(SOL.colorCentro) },
        uBorde:    { value: vec3DeHex(SOL.colorBorde) },
        uOscur:    { value: SOL.oscurecimiento },
        uContGrano:{ value: SOL.grano },
        uManchasK: { value: SOL.manchas },
        uManchasL: { value: SOL.manchasLejos },
        uManchas:  { value: manchas }
      },
      vertexShader: `
        varying vec3 vPos;      // punto de la esfera unidad (espacio del objeto → gira con el sol)
        varying vec3 vNormalV;  // normal en espacio de cámara
        varying vec3 vViewPos;  // posición en espacio de cámara
        void main() {
          vPos = normalize(position);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vViewPos = mv.xyz;
          vNormalV = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: RUIDO_GLSL + `
        uniform float uTiempo;
        uniform float uGrano;
        uniform vec3  uCentro;
        uniform vec3  uBorde;
        uniform float uOscur;
        uniform float uContGrano;
        uniform float uManchasK;
        uniform float uManchasL;
        uniform vec4  uManchas[${MAX_MANCHAS}];
        varying vec3 vPos;
        varying vec3 vNormalV;
        varying vec3 vViewPos;

        // GRANULACIÓN = celdas de convección: gas caliente que sube por el
        // centro de cada celda (claro) y baja ya frío por los bordes (calles
        // oscuras). Se dibuja con ruido CELULAR (Worley): distancia al punto
        // más cercano (F1) y al segundo (F2); F2−F1 ≈ 0 en la frontera.
        vec3 hash3(vec3 p) {
          p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
                   dot(p, vec3(269.5, 183.3, 246.1)),
                   dot(p, vec3(113.5, 271.9, 124.6)));
          return fract(sin(p) * 43758.5453123);
        }
        vec2 worley(vec3 p, float t) {
          vec3 i = floor(p), f = fract(p);
          float f1 = 8.0, f2 = 8.0;
          for (int z = -1; z <= 1; z++)
          for (int y = -1; y <= 1; y++)
          for (int x = -1; x <= 1; x++) {
            vec3 g = vec3(float(x), float(y), float(z));
            vec3 o = 0.5 + 0.4 * sin(t + 6.2831 * hash3(i + g)); // los centros se mueven → las celdas hierven
            float d = length(g + o - f);
            if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) { f2 = d; }
          }
          return vec2(f1, f2);
        }

        // Mancha: umbra + penumbra. Contraste REAL: la umbra emite ~25 % y la
        // penumbra ~78 % de la luz de alrededor (en fotos salen negras solo
        // porque la cámara se ajusta al disco brillante).
        float sombraMancha(vec3 p, vec4 m, float idx, float t) {
          vec3 c = m.xyz;
          float s = m.w * (0.9 + 0.1 * sin(t * 0.05 + idx * 1.7));
          if (s <= 0.0 || dot(p, c) < 0.9) return 1.0;
          vec3 u = normalize(cross(c, abs(c.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
          vec3 v = cross(c, u);
          vec2 q = vec2(dot(p, u), dot(p, v));
          float d = length(q);
          vec2 dir = q / max(d, 1e-5);
          float r = s * (1.0 + 0.15 * snoise(vec3(dir * 1.2, idx * 3.1)));
          float x = d / r;
          if (x > 1.05) return 1.0;
          float umbra    = 1.0 - smoothstep(0.34, 0.44, x * (1.0 + 0.12 * snoise(vec3(dir * 3.0, idx))));
          float penumbra = 1.0 - smoothstep(0.82, 1.0, x);
          // filamentos de la penumbra: casi invisibles de lejos, se ven al acercarse
          float fil = snoise(vec3(dir * 16.0, x * 0.5 + idx * 7.0 + t * 0.02));
          float pen = 0.78 + (0.03 + 0.07 * uGrano) * fil;
          float b = mix(1.0, pen, penumbra);
          b = mix(b, 0.25, umbra);
          // de lejos, a la vez que desaparece el grano, la mancha pierde contraste
          return mix(1.0, b, uManchasK * mix(uManchasL, 1.0, uGrano));
        }

        void main() {
          vec3 p = vPos;
          float t = uTiempo;
          float mu = clamp(dot(normalize(vNormalV), normalize(-vViewPos)), 0.0, 1.0); // 1 centro · 0 borde

          // Color de base: más caliente (claro) en el centro, más frío (rojizo) al borde
          vec3 col = mix(uBorde, uCentro, pow(mu, 0.7));

          // Variaciones muy suaves a gran escala (supergranulación): vida, sin "líquido"
          col *= 1.0 + 0.03 * snoise(p * 6.0 + vec3(0.0, 0.0, t * 0.01));

          // GRANULACIÓN: solo se calcula de cerca (si no, ahorra el trabajo)
          if (uGrano > 0.01) {
            vec3 q = p * 45.0 + 0.2 * vec3(snoise(p * 50.0 + vec3(t * 0.1)));  // bordes irregulares, no polígonos
            vec2 c = worley(q, t * 0.5);
            float centro = 1.0 - smoothstep(0.0, 0.9, c.x);           // brillo: máximo en el centro, cae hacia fuera
            float calle  = 1.0 - smoothstep(0.0, 0.45, c.y - c.x);    // 1 en las calles entre gránulos
            float g = 0.92 + 0.12 * centro - 0.07 * calle;
            vec3 tinte = mix(vec3(1.0), vec3(0.92, 0.80, 0.70), calle); // las calles, más frías → más rojizas
            col *= mix(vec3(1.0), g * tinte, uGrano * uContGrano);
          }

          // MANCHAS y REGIONES ACTIVAS (para las fáculas)
          float sombra = 1.0;
          float act = 0.0;
          for (int i = 0; i < ${MAX_MANCHAS}; i++) {
            vec4 m = uManchas[i];
            sombra = min(sombra, sombraMancha(p, m, float(i), t));
            if (m.w > 0.0) act = max(act, exp(-pow(length(p - m.xyz) / (m.w * 3.5), 2.0)));
          }
          // lo oscuro de una mancha tira a pardo-rojizo (está más fría), no a gris
          col *= sombra * mix(vec3(0.95, 0.55, 0.40), vec3(1.0), smoothstep(0.2, 0.9, sombra));

          // FÁCULAS: motas claras alrededor de las regiones activas, visibles solo
          // cerca del borde (en el centro del disco no contrastan)
          float motas = smoothstep(0.15, 0.75, 0.5 + 0.5 * snoise(p * 28.0 + vec3(t * 0.03)));
          col *= 1.0 + act * motas * pow(1.0 - mu, 1.3) * 0.45;

          // OSCURECIMIENTO DEL BORDE
          col *= 1.0 - uOscur * (1.0 - mu);

          gl_FragColor = vec4(min(col, vec3(1.0)), 1.0);
        }
      `
    });
    const sol = new THREE.Mesh(new THREE.SphereGeometry(RADIO_SOL, 128, 128), matSol);
    escena.add(sol);

    // ── 2) BORDE: ESPÍCULAS ────────────────────────────────────────
    // Un plano colocado justo donde está el CONTORNO visible del sol (el
    // círculo tangente, que queda un poco por delante del centro) y orientado
    // hacia la cámara. Así lo que dibuja encaja con el borde, y un planeta que
    // pase por delante del sol lo tapa correctamente.
    // Espículas: miles de chorros finos de plasma que el campo magnético lanza
    // hacia arriba y vuelven a caer. Cada uno tiene su altura y su ritmo
    // (de 5 a 12 s): el borde deja de ser una línea y "chisporrotea".
    // (Las protuberancias van aparte, en 3D: ver más abajo.)
    const EXT_CORONA = 3.0; // el plano llega a 3 radios solares
    const uniCorona = {
      uTiempo,
      uK:      { value: 1.0 },   // corrección de perspectiva del borde (ver bucle)
      uRadioPx:{ value: 100 },   // radio del sol en píxeles de pantalla (ver bucle)
      uEsp:    { value: SOL.espiculas },
      uExt:    { value: EXT_CORONA }
    };
    const corona = new THREE.Mesh(
      new THREE.PlaneGeometry(RADIO_SOL * 2 * EXT_CORONA, RADIO_SOL * 2 * EXT_CORONA),
      new THREE.ShaderMaterial({
        uniforms: uniCorona,
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: RUIDO_GLSL + `
          uniform float uTiempo;
          uniform float uK;
          uniform float uRadioPx;
          uniform float uEsp;
          uniform float uExt;
          varying vec2 vUv;

          float azar(float x) { return fract(sin(x * 127.1 + 31.7) * 43758.5453); }

          // ESPÍCULAS. El contorno se divide en N columnas finas; cada columna es
          // un chorro con su altura máxima, su ritmo y su desfase. Su altura sube
          // y baja (sin(π·fase)): el plasma salta y cae. Dos capas con distinto
          // N, mezcladas, para que no se note ninguna regularidad.
          float espiculas(vec2 dir, float h, float t) {
            float th = atan(dir.y, dir.x) / 6.2831853 + 0.5;   // 0..1 alrededor del borde
            float s = 0.0;
            for (int capa = 0; capa < 2; capa++) {
              float N = capa == 0 ? 420.0 : 610.0;
              float anchoPx = 6.2831853 * uRadioPx / N;          // anchura de una columna en píxeles
              float visible = smoothstep(1.2, 3.0, anchoPx);       // de lejos se apagan (evita parpadeo)
              if (visible <= 0.0) continue;
              float x = th * N;
              float k = floor(x) + float(capa) * 1000.0;
              float u = fract(x) - 0.5;                           // posición dentro de la columna
              float a1 = azar(k * 1.31), a2 = azar(k * 2.17 + 3.0), a3 = azar(k * 0.73 + 11.0);
              float periodo = 5.0 + 7.0 * a1;                     // segundos que dura un salto
              float fase = fract(t / periodo + a2);
              float vida = sin(3.14159 * fase);                   // sube… y cae
              float H = (0.006 + 0.028 * a3 * a3) * vida;         // altura (en radios solares)
              float lat = 1.0 - smoothstep(0.06, 0.28, abs(u - (a1 - 0.5) * 0.4)); // chorro fino
              float vert = 1.0 - smoothstep(0.0, H, h);           // se afila y desvanece hacia la punta
              s = max(s, lat * vert * (0.5 + 0.5 * a2) * visible);
            }
            // base: una franja muy baja y desigual pegada al borde, para que el
            // contorno quede deshilachado incluso de lejos
            float base = 1.0 - smoothstep(0.0, 0.004 + 0.004 * (0.5 + 0.5 * snoise(vec3(dir * 40.0, t * 0.3))), h);
            return max(s, base * 0.8);
          }

          void main() {
            vec2 c = (vUv - 0.5) * 2.0 * uExt;   // coordenadas en radios solares
            float rr = length(c);
            float r  = rr * uK;                  // 1.0 = borde del disco tal como se VE
            if (r < 0.998) discard;
            vec2 dir = c / rr;
            float h = r - 1.0;
            float t = uTiempo;

            // ESPÍCULAS: del MISMO color que el borde del disco (rojizo oscuro, por
            // el oscurecimiento del limbo) → lo prolongan en vez de dibujar una línea
            float es = espiculas(dir, max(h, 0.0), t);
            vec3 col = vec3(0.80, 0.42, 0.14) * es * uEsp; // tono del borde (ahora más claro)

            col *= 1.0 - smoothstep(uExt * 0.77, uExt, rr);  // apagar antes del borde del plano
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    escena.add(corona);

    // ── 3) PROTUBERANCIAS en 3D: HACES DE BUCLES de campo magnético ──
    // Cada protuberancia es un haz de bucles: decenas de "tubos" finos de plasma,
    // cada uno siguiendo una línea de campo de un pie al otro. Los bucles se
    // reparten a lo largo de la base, en altura y en PROFUNDIDAD (a ambos lados
    // del plano del arco): es un volumen, no una lámina, y se ve 3D desde
    // cualquier ángulo (los bucles se cruzan y se tapan con paralaje real).
    // Cada tubo se dibuja como una cinta que siempre se encara a la cámara, con
    // el centro más brillante que los bordes → parece cilíndrico.
    // El haz es HIJO del sol → gira con él. Nace, vive y se apaga, y reaparece
    // en otro punto, casi siempre lejos de las manchas.
    const prots = [];
    const N_BUCLES = 36, N_SEG = 48;
    function geometriaHaz() {
      const nV = N_BUCLES * (N_SEG + 1) * 2;
      const aS = new Float32Array(nV), aLado = new Float32Array(nV), aBucle = new Float32Array(nV * 4);
      const idx = [];
      let v = 0;
      for (let b = 0; b < N_BUCLES; b++) {
        const prof   = Math.random() * 2 - 1;                    // profundidad: −1..1 a través del haz
        const altura = 0.35 + 0.65 * Math.sqrt(Math.random());   // altura relativa (más bucles altos que bajos)
        const despl  = (Math.random() * 2 - 1) * 0.35;           // desplazamiento a lo largo de la base
        const semilla = Math.random() * 50;
        const v0 = v;
        for (let i = 0; i <= N_SEG; i++) {
          for (const lado of [-1, 1]) {
            aS[v] = i / N_SEG; aLado[v] = lado;
            aBucle.set([prof, altura, despl, semilla], v * 4);
            v++;
          }
        }
        for (let i = 0; i < N_SEG; i++) {
          const a = v0 + i * 2;
          idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nV * 3), 3)); // la posición real la calcula el shader
      g.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
      g.setAttribute('aLado', new THREE.BufferAttribute(aLado, 1));
      g.setAttribute('aBucle', new THREE.BufferAttribute(aBucle, 4));
      g.setIndex(idx);
      return g;
    }

    for (let i = 0; i < SOL.numProtuberancias; i++) {
      const uni = {
        uTiempo,
        uCentro:  { value: new THREE.Vector3(1, 0, 0) }, // punto medio de la base (dirección, en el sistema del sol)
        uTang:    { value: new THREE.Vector3(0, 0, 1) }, // dirección a lo largo de la base
        uAncho:   { value: 0.12 },  // media anchura de la base (radianes)
        uAlto:    { value: 0.10 },  // altura máxima (en radios solares)
        uInclin:  { value: 0.3 },   // cuánto se ladea el haz (proporción de la altura)
        uSemilla: { value: Math.random() * 100 },
        uEnv:     { value: 0 },     // ciclo de vida: 0 apagada · 1 plena
        uBrillo:  { value: SOL.protuberancias },
        uRadio:   { value: RADIO_SOL }
      };
      const mesh = new THREE.Mesh(geometriaHaz(), new THREE.ShaderMaterial({
        uniforms: uni,
        vertexShader: `
          uniform vec3 uCentro, uTang;
          uniform float uAncho, uAlto, uInclin, uSemilla, uRadio;
          attribute float aS, aLado;
          attribute vec4 aBucle;   // profundidad, altura relativa, desplazamiento, semilla
          varying float vLado, vS, vAltura;
          varying vec3 vMundo;
          varying float vSem;

          // Punto del bucle a la fracción s (0 = un pie, 1 = el otro), en el sistema del sol
          vec3 punto(float s) {
            float anchoB = uAncho * (0.55 + 0.45 * aBucle.y);              // los bucles altos, más anchos
            float ang = (aBucle.z + (s - 0.5) * 2.0) * anchoB;
            vec3 dir = normalize(cos(ang) * uCentro + sin(ang) * uTang);
            vec3 bin = normalize(cross(uCentro, uTang));                   // a través del haz
            float x = 2.0 * s - 1.0;
            float h = uAlto * aBucle.y * sqrt(max(0.0, 1.0 - x * x))
                    * (1.0 + 0.12 * sin(s * 5.0 + aBucle.w + uSemilla));   // cada bucle algo irregular
            float grosor = uAlto * 0.45;                                    // anchura del haz en profundidad
            return dir * uRadio * (0.995 + h)
                 + bin * uRadio * (aBucle.x * grosor * (0.4 + 0.6 * sqrt(max(0.0, 1.0 - x * x))) + h * uInclin);
          }

          void main() {
            vec3 p  = (modelMatrix * vec4(punto(aS), 1.0)).xyz;
            vec3 pA = (modelMatrix * vec4(punto(max(aS - 0.01, 0.0)), 1.0)).xyz;
            vec3 pB = (modelMatrix * vec4(punto(min(aS + 0.01, 1.0)), 1.0)).xyz;
            vec3 tang = normalize(pB - pA + 1e-6);
            vec3 hacia = normalize(cameraPosition - p);
            vec3 lado = cross(tang, hacia);
            lado = length(lado) > 1e-4 ? normalize(lado) : vec3(0.0, 1.0, 0.0);
            float ancho = uRadio * uAlto * 0.06;                            // grosor de cada tubo
            p += lado * aLado * ancho;
            vLado = aLado; vS = aS; vAltura = aBucle.y; vSem = aBucle.w; vMundo = p;
            gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
          }
        `,
        fragmentShader: RUIDO_GLSL + `
          uniform float uTiempo, uEnv, uBrillo, uSemilla, uRadio;
          varying float vLado, vS, vAltura, vSem;
          varying vec3 vMundo;
          void main() {
            float tubo  = pow(1.0 - abs(vLado), 1.5);                              // centro brillante, bordes suaves → cilindro
            float nudos = 0.55 + 0.45 * snoise(vec3(vS * 7.0 - uTiempo * 0.12, vSem, uSemilla)); // plasma que corre por el bucle
            float pies  = smoothstep(0.0, 0.08, vS) * (1.0 - smoothstep(0.92, 1.0, vS));
            float a = tubo * nudos * pies * (0.35 + 0.35 * vAltura) * uEnv;
            if (a < 0.004) discard;
            // sobre el disco, algo más tenue (el mismo tono, sin volverse negro ni blanco)
            vec3 rayo = normalize(vMundo - cameraPosition);
            vec3 oc = -cameraPosition;
            float tca = dot(oc, rayo);
            float dist = sqrt(max(dot(oc, oc) - tca * tca, 0.0));
            float sobreDisco = (1.0 - smoothstep(uRadio * 0.995, uRadio * 1.01, dist)) * step(0.0, tca);
            vec3 col = vec3(1.0, 0.47, 0.22) * 0.95 * uBrillo;
            gl_FragColor = vec4(col, a * mix(1.0, 0.75, sobreDisco));
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      }));
      mesh.frustumCulled = false; // la forma se calcula en el shader: el recorte automático no la conoce
      sol.add(mesh);
      prots.push({ uni, periodo: 150 + Math.random() * 100, desfase: Math.random(), k: -1 }); // viven ~1,5–2,5 min: les da tiempo a dar media vuelta o más con el sol
    }

    // Recolocar una protuberancia que (re)nace: dónde, orientación, tamaño
    function nacerProtuberancia(pr) {
      // Casi todas son "tranquilas": latitudes medias (20°–60°) y LEJOS de las
      // manchas (las grandes y largas de las fotos son así). Alguna (20 %) bordea
      // una región activa, pero sin tocar sus manchas.
      const grupos = manchas.filter(m => m.w > 0.03);
      let c = null;
      if (grupos.length && Math.random() < 0.2) {
        const m = new THREE.Vector3().copy(grupos[(Math.random() * grupos.length) | 0]).normalize();
        const lado = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).cross(m).normalize();
        c = m.multiplyScalar(Math.cos(0.3)).addScaledVector(lado, Math.sin(0.3)).normalize(); // a ~17° de la mancha
      } else {
        for (let intento = 0; intento < 20; intento++) {
          const lat = (Math.random() < 0.5 ? 1 : -1) * (20 + Math.random() * 40) * Math.PI / 180;
          c = dirLatLon(lat, Math.random() * Math.PI * 2);
          if (!grupos.some(m => c.dot(new THREE.Vector3(m.x, m.y, m.z).normalize()) > Math.cos(0.35))) break; // lejos de manchas
        }
      }
      const azarV = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
      const t = azarV.cross(c).normalize();                    // dirección cualquiera tangente a la superficie
      pr.uni.uCentro.value.copy(c);
      pr.uni.uTang.value.copy(t);
      pr.uni.uAncho.value = 0.08 + Math.random() * 0.10;
      pr.uni.uAlto.value  = Math.random() < 0.15 ? 0.16 + Math.random() * 0.08   // de vez en cuando, una grande
                                                 : 0.05 + Math.random() * 0.09;
      pr.uni.uInclin.value = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.3); // siempre algo ladeada: vista desde arriba tiene anchura
      pr.uni.uSemilla.value = Math.random() * 100;
    }

    // Ciclo de vida (se llama en cada fotograma)
    function actualizarProtuberancias() {
      for (const pr of prots) {
        const ciclo = uTiempo.value / pr.periodo + pr.desfase;
        const k = Math.floor(ciclo);
        if (k !== pr.k) { pr.k = k; nacerProtuberancia(pr); }
        const f = ciclo - k;
        // nace (0→0.08), vive, se apaga (0.62→0.72) y descansa hasta renacer en otro sitio
        pr.uni.uEnv.value = THREE.MathUtils.smoothstep(f, 0, 0.08) * (1 - THREE.MathUtils.smoothstep(f, 0.62, 0.72));
      }
    }

    // ── 4) HALO: gradiente suave, sin rayos ──────────────────────────
    // Perfil desde el borde del sol (x = 0) hasta el final del halo (x = 1):
    //   brillo = 1.2 · (1 − x)^1.2   (relativo al que tenía antes junto al borde)
    // → junto a la superficie un 20 % más intenso; a media distancia, igual que
    //   antes; y se apaga hacia fuera de forma gradual, sin un final marcado.
    const ESCALA_HALO = 5.85; // tamaño del halo en radios solares (diámetro)
    function texturaHalo() {
      const N = 256;
      const c = document.createElement('canvas');
      c.width = c.height = N;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
      const rs = 2 / ESCALA_HALO;       // dónde cae el borde del sol en la textura (0..1)
      const base = 0.564;               // brillo que tenía el halo antes junto al borde
      grad.addColorStop(0, `rgba(255,255,255,${(base * 1.2).toFixed(4)})`);
      for (let i = 0; i <= 40; i++) {
        const x = i / 40;
        const a = base * 1.2 * Math.pow(1 - x, 1.2);
        grad.addColorStop(rs + x * (1 - rs), `rgba(255,255,255,${a.toFixed(4)})`);
      }
      g.fillStyle = grad;
      g.fillRect(0, 0, N, N);
      return new THREE.CanvasTexture(c);
    }
    const haloSol = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texturaHalo(), color: 0xffcc88, opacity: 0.345 * SOL.halo, // 0.3 + 15 %
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    haloSol.scale.setScalar(RADIO_SOL * ESCALA_HALO);
    escena.add(haloSol);

    const luzSol = new THREE.PointLight(0xffd9a0, 4, 3000, 0.08);
    escena.add(luzSol);
    escena.add(new THREE.AmbientLight(0x223044, 0.45));

    // ════════════════════════════════════════════════════════════
    //  LUCES NOCTURNAS (tecnomarcadores)
    //  - num: cantidad (más en mundos habitables, pocas en los demás)
    //  - puntos PEGADOS a la superficie, finos y tenues.
    // ════════════════════════════════════════════════════════════
    function crearLucesNocturnas(radio, num) {
      // Distribución AGRUPADA: las luces se juntan en "núcleos" (como ciudades)
      // en vez de salpicarse uniformes por toda la esfera.
      const nNucleos = Math.max(3, Math.round(num / 25));
      const centros = [];
      for (let c = 0; c < nNucleos; c++) {
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        centros.push(new THREE.Vector3(
          Math.sin(ph) * Math.cos(th), Math.sin(ph) * Math.sin(th), Math.cos(ph)
        ));
      }
      const p = new Float32Array(num * 3);
      const brillo = new Float32Array(num); // brillo individual → menos homogéneo
      const v = new THREE.Vector3();
      for (let i = 0; i < num; i++) {
        const centro = centros[(Math.random() * nNucleos) | 0];
        // punto cerca del núcleo: el centro + un pequeño desvío, renormalizado
        v.copy(centro).addScaledVector(
          new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5),
          0.22
        ).normalize().multiplyScalar(radio);
        p[i*3] = v.x; p[i*3+1] = v.y; p[i*3+2] = v.z;
        brillo[i] = 0.25 + Math.random() * 0.75; // de tenue a medio-brillante
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      geo.setAttribute('brillo', new THREE.BufferAttribute(brillo, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: { dirLuz: { value: new THREE.Vector3(1, 0, 0) } },
        vertexShader: `
          uniform vec3 dirLuz;
          attribute float brillo;
          varying float visibilidad;
          varying float vBrillo;
          void main() {
            vec3 normalMundo = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            float cara = dot(normalMundo, dirLuz);       // >0 día, <0 noche
            visibilidad = smoothstep(0.05, -0.25, cara); // solo de noche
            vBrillo = brillo;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 0.8 + brillo * 1.0;           // tamaño variable
          }
        `,
        fragmentShader: `
          varying float visibilidad;
          varying float vBrillo;
          void main() {
            if (visibilidad < 0.01) discard;
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float a = visibilidad * vBrillo * 0.32;      // más tenue y según brillo propio
            gl_FragColor = vec4(1.0, 0.8, 0.45, a);
          }
        `,
        transparent: true,
        depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    // ════════════════════════════════════════════════════════════
    //  LOS MUNDOS  (ordenados por lógica térmica: del más caliente,
    //  pegado a la estrella, al más frío en el exterior)
    //
    //  r       radio (relaciones realistas: rocosos pequeños, gigante
    //          gaseoso mucho mayor, pero todos muy por debajo del sol)
    //  dist    distancia orbital
    //  incl    inclinación de la órbita (grados)
    //  color   color del punto visto de lejos
    //  luces   nº de luces de ciudad (0 = sin superficie habitada)
    //  tex     imágenes *-sc.png = versiones sin costura (las originales siguen en la carpeta)
    //  poloOscuro  oscurece los casquetes polares (solo el gaseoso)
    //  anclado anclaje por marea. Con estrella K sólo los interiores
    //          suelen anclarse; los de la zona habitable y exteriores, no.
    // ════════════════════════════════════════════════════════════
    const mundos = [
      { tex: '5-lava-sc.png',       r: 0.35, dist: 12, incl: 0,  color: 0xd1552e, luces: 30,  anclado: true  }, // magmático, el más interior
      { tex: '2-desertica-sc.png',  r: 0.45, dist: 16, incl: 0,  color: 0xc88a4a, luces: 120, anclado: true  }, // desértico, caliente y seco
      { tex: '8-roca-sc.png',       r: 0.30, dist: 20, incl: 14, color: 0x8a7f72, luces: 60,  anclado: false }, // rocoso desplazado (órbita inclinada)
      { tex: '1-islas-sc.png',      r: 0.50, dist: 26, incl: 0,  color: 0x6fae7a, luces: 650, anclado: false }, // archipiélagos — zona habitable
      { tex: '4-templado-sc.png',   r: 0.55, dist: 31, incl: 0,  color: 0x7bbf8f, luces: 550, anclado: false }, // templado — zona habitable
      { tex: '7-estepa-sc.png',     r: 0.45, dist: 38, incl: 0,  color: 0x9fae73, luces: 150, anclado: false }, // estepa, más frío
      { tex: '3-helado-sc.png',     r: 0.40, dist: 46, incl: 0,  color: 0xaccadf, luces: 40,  anclado: false }, // helado, exterior
      { tex: '6-gaseoso1-sc.png',   r: 1.40, dist: 58, incl: 0,  color: 0xb79a6e, luces: 0,   anclado: false, poloOscuro: 0.3 }  // gigante gaseoso — sin superficie, sin luces; polos más oscuros y turbulentos (como Júpiter)
    ];

    // ════════════════════════════════════════════════════════════
    //  MAPEO HÍBRIDO de planetas: imagen envuelta + CASQUETES POLARES
    //
    //  Una imagen rectangular envuelta en una esfera aprieta toda su fila de
    //  arriba en un solo punto → el polo se ve estirado en estrella. Aquí,
    //  cerca de cada polo, en vez de envolver se PROYECTA la imagen desde
    //  arriba (como un proyector de diapositivas apuntando al polo): el dibujo
    //  conserva su forma. La frontera entre las dos zonas es ondulada y suave,
    //  para que no se note un círculo.
    //  (La costura vertical se arregla aparte, en la propia imagen: *-sc.png)
    // ════════════════════════════════════════════════════════════
    const CASQUETE = { desde: 0.72, hasta: 0.86 }; // |seno de la latitud|: empieza ~46°, completo ~59°
    function aplicarCasquetes(material, oscuro = 0) { // oscuro: cuánto se oscurece el casquete (0 = nada)
      material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
          .replace('#include <map_fragment>', `
            #ifdef USE_MAP
              vec3 nObj = normalize(vObjPos);              // punto de la esfera (gira con el planeta)
              vec4 cEnv = texture2D(map, vMapUv);          // imagen envuelta (lo de siempre)
              // Proyección desde arriba. Escala elegida para que 1 píxel de la imagen
              // mida lo mismo que en el ecuador (u: 1/2π, v: 1/π). Cada polo toma la
              // franja de la imagen que ya le corresponde (arriba el norte, abajo el sur).
              float sur = step(nObj.y, 0.0);
              vec2 uvP = vec2(nObj.x * 0.159, nObj.z * 0.318) + mix(vec2(0.5, 0.80), vec2(0.5, 0.20), sur);
              vec4 cPol = texture2D(map, uvP);
              float ang = atan(nObj.z, nObj.x);
              float lat = abs(nObj.y) + 0.035 * sin(ang * 5.0 + sur * 2.0) + 0.02 * sin(ang * 11.0 + 1.3);
              float polo = smoothstep(${CASQUETE.desde.toFixed(3)}, ${CASQUETE.hasta.toFixed(3)}, lat);
              diffuseColor *= mix(cEnv, cPol * ${(1 - oscuro).toFixed(3)}, polo);
            #endif`);
      };
    }

    const planetas = [];

    mundos.forEach((m) => {
      const grupo = new THREE.Group(); // se traslada por la órbita; el mesh rota dentro
      escena.add(grupo);

      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      aplicarCasquetes(mesh.material, m.poloOscuro || 0); // polos sin estirar
      grupo.add(mesh);

      // (sin halo: los planetas se ven como discos reales, a su tamaño)

      // Luces nocturnas pegadas a la superficie (hijas del mesh → rotan con él)
      let luces = null;
      if (m.luces > 0) {
        luces = crearLucesNocturnas(m.r * 1.0015, m.luces);
        mesh.add(luces);
      }

      const inclRad = m.incl * Math.PI / 180; // (líneas de órbita eliminadas)

      planetas.push({
        grupo, mesh, luces,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 0.005 / Math.sqrt(m.dist), // 25% de la velocidad original
        anclado: m.anclado,
        r: m.r
      });
    });

    // ════════════════════════════════════════════════════════════
    //  INTERACCIÓN: clic → vuela al planeta; clic en vacío → volver
    // ════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const raton = new THREE.Vector2();
    let enfocado = null;   // planeta enfocado (null = vista general)
    let volando = false;   // true mientras la cámara viaja a su destino
    let tProg = 0;                          // progreso de la transición 0→1 (evita el salto al fijar)
    const entryPos  = new THREE.Vector3();  // pose de cámara al arrancar la transición
    const entryMira = new THREE.Vector3();

    // ── Giro alrededor del planeta fijado ──
    // TrackballControls (no OrbitControls) porque permite pasar por encima de
    // los polos y seguir girando: OrbitControls se detiene en el polo.
    const giroPlaneta = new TrackballControls(camara, renderer.domElement);
    giroPlaneta.rotateSpeed = 2.5;
    giroPlaneta.zoomSpeed = 1.0;
    giroPlaneta.noPan = true;              // sin desplazar: siempre centrado en el planeta
    giroPlaneta.dynamicDampingFactor = 0.12; // inercia suave al soltar
    giroPlaneta.enabled = false;
    const entryUp   = new THREE.Vector3();  // orientación ("arriba") de la cámara al arrancar el vuelo
    const posPrevia = new THREE.Vector3();  // posición del planeta en el fotograma anterior

    const cieloQ0 = new THREE.Quaternion();   // orientación del cielo respecto a la cámara al arrancar el vuelo
    const Q_ID = new THREE.Quaternion();      // = su encuadre original
    function empezarVuelo() {
      if (cielo.parent !== camara) camara.attach(cielo); // re-enganchar sin saltos (conserva dónde estaba)
      cieloQ0.copy(cielo.quaternion);
      volando = true; tProg = 0;
      entryPos.copy(camara.position);
      entryUp.copy(camara.up);
      giroPlaneta.enabled = false;
      controls.enabled = false;
    }

    // Distinguir un clic real de un arrastre de los controles de cámara
    let abajoX = 0, abajoY = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { abajoX = e.clientX; abajoY = e.clientY; });

    window.addEventListener('click', (e) => {
      if (Math.hypot(e.clientX - abajoX, e.clientY - abajoY) > 6) return; // fue arrastre, no clic
      raton.x = (e.clientX / window.innerWidth) * 2 - 1;
      raton.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(raton, camara);
      const hit = ray.intersectObjects(planetas.map(p => p.mesh), false);
      if (hit.length) {
        const p = planetas.find(pp => pp.mesh === hit[0].object);
        if (p !== enfocado) {
          // Punto de partida del vuelo: desde donde MIRAMOS ahora. Si ya estábamos
          // en un planeta (o volando) es miraFoco; en la vista general, el centro
          // de OrbitControls. (Antes siempre se tomaba éste → el salto al sol.)
          entryMira.copy(enfocado || volando ? miraFoco : controls.target);
          enfocado = p; empezarVuelo();
        }
      } else if (enfocado) {
        entryMira.copy(miraFoco);
        enfocado = null; empezarVuelo(); // volver a la vista general
      }
    });

    // ════════════════════════════════════════════════════════════
    //  BUCLE
    // ════════════════════════════════════════════════════════════
    const fuera    = new THREE.Vector3();
    const lado     = new THREE.Vector3();
    const destino  = new THREE.Vector3();
    const miraFoco = new THREE.Vector3();
    const ARRIBA   = new THREE.Vector3(0, 1, 0);
    const delta    = new THREE.Vector3();

    // Duración de los vuelos en SEGUNDOS (igual en cualquier ordenador, vaya a los fps que vaya)
    const VUELO = { ir: 1.4, volver: 1.6 };

    function suavizar(t) { return t * t * (3 - 2 * t); } // smoothstep para transiciones

    const reloj = new THREE.Clock();
    const haciaCam = new THREE.Vector3();

    function animar() {
      requestAnimationFrame(animar);
      const dt = Math.min(reloj.getDelta(), 0.1); // segundos desde el fotograma anterior (tope: si la pestaña duerme, no da un salto)
      uTiempo.value += dt * SOL.velocidad;
      sol.rotation.y -= SOL.giro * dt; // por segundos, no por fotogramas: igual en el Chromebook que en el PC
      actualizarProtuberancias();

      planetas.forEach((p) => {
        p.angulo += p.velocidad;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.grupo.position.set(x, y, z * Math.cos(p.incl));

        if (p.anclado) {
          p.mesh.lookAt(0, 0, 0);     // misma cara a la estrella
        } else {
          p.mesh.rotation.y -= 0.01;  // rota libre, en el mismo sentido que su órbita (prógrado)
        }

        if (p.luces) {
          // dirección del planeta HACIA la estrella (en el origen)
          p.luces.material.uniforms.dirLuz.value.copy(p.grupo.position).multiplyScalar(-1).normalize();
        }
      });

      // ─── Cámara ───
      if (enfocado) {
        // Al LLEGAR: vista de TERMINADOR (algo más de media cara iluminada, la
        // línea día/noche y las luces en la mitad oscura). Después, el ratón
        // gira libremente alrededor del planeta, que la cámara acompaña.
        const pos = enfocado.grupo.position;
        const d = 12.7 * enfocado.r;                  // distancia → el planeta ocupa ~20% de pantalla
        fuera.copy(pos).normalize();                  // sol → planeta (radial)
        lado.crossVectors(ARRIBA, fuera).normalize(); // tangencial (si la mitad iluminada sale al otro lado, invertir el signo de 0.93)
        destino.copy(pos)
          .addScaledVector(fuera, -0.10 * d)          // un pelín hacia el sol → algo más de media cara iluminada
          .addScaledVector(lado,   0.93 * d)          // sobre todo lateral → vista de terminador
          .addScaledVector(ARRIBA, 0.26 * d);         // leve elevación
        controls.enabled = false;
        if (volando) {
          tProg = Math.min(1, tProg + dt / VUELO.ir);
          const e = suavizar(tProg);
          camara.position.lerpVectors(entryPos, destino, e);
          miraFoco.lerpVectors(entryMira, pos, e);
          camara.up.lerpVectors(entryUp, ARRIBA, e).normalize(); // si veníamos girados, enderezar
          camara.lookAt(miraFoco);
          cielo.quaternion.slerpQuaternions(cieloQ0, Q_ID, e);   // el cielo vuelve a su encuadre
          cielo.position.set(0, 0, 0);
          if (tProg >= 1) {
            // Llegada: el mando pasa al giro libre alrededor del planeta
            volando = false;
            posPrevia.copy(pos);
            giroPlaneta.target.copy(pos);
            giroPlaneta.minDistance = enfocado.r * 2.2;  // no meterse en el planeta
            giroPlaneta.maxDistance = enfocado.r * 40;
            giroPlaneta.enabled = true;
            camara.updateMatrixWorld();
            escena.attach(cielo);  // soltar el cielo: queda fijo en el espacio
          }
        } else {
          // CO-MÓVIL: la cámara se desplaza lo mismo que el planeta en su órbita
          // → el planeta queda quieto en cuadro; el ratón gira alrededor de él.
          camara.position.add(delta.subVectors(pos, posPrevia));
          posPrevia.copy(pos);
          giroPlaneta.target.copy(pos);
          giroPlaneta.update();
          miraFoco.copy(pos);
          cielo.position.copy(camara.position); // el cielo acompaña a la cámara en posición (está "en el infinito"), no en giro
        }
      } else if (volando) {
        // Volver a la vista general
        controls.enabled = false;
        tProg = Math.min(1, tProg + dt / VUELO.volver);
        const e = suavizar(tProg);
        camara.position.lerpVectors(entryPos, VISTA_GENERAL, e);
        miraFoco.lerpVectors(entryMira, MIRADA_GENERAL, e);
        camara.up.lerpVectors(entryUp, ARRIBA, e).normalize(); // enderezar
        camara.lookAt(miraFoco);
        cielo.quaternion.slerpQuaternions(cieloQ0, Q_ID, e);     // el cielo vuelve a su encuadre
        cielo.position.set(0, 0, 0);
        if (tProg >= 1) {
          volando = false;
          camara.up.copy(ARRIBA);
          controls.target.copy(MIRADA_GENERAL);       // devolver el mando a OrbitControls
        }
      } else {
        controls.enabled = true;                        // vista general libre
        controls.update();
      }

      // ─── Borde (espículas) y halo (después de mover la cámara) ───
      haloSol.position.copy(sol.position);
      const D = camara.position.distanceTo(sol.position);
      // El contorno que vemos NO es el ecuador de la esfera: es un círculo
      // tangente, algo por delante del centro (a R²/D) y algo menor (R/uK).
      // El plano se coloca ahí, perpendicular a la línea sol→cámara.
      uniCorona.uK.value = D / Math.sqrt(Math.max(D * D - RADIO_SOL * RADIO_SOL, 1e-3));
      haciaCam.subVectors(camara.position, sol.position).normalize();
      corona.position.copy(sol.position).addScaledVector(haciaCam, RADIO_SOL * RADIO_SOL / D);
      corona.up.set(0, 1, 0).applyQuaternion(camara.quaternion); // mismo "arriba" que la cámara (sin giros raros)
      corona.lookAt(camara.position);
      // radio aparente del sol en píxeles (para apagar las espículas cuando son menores que un píxel)
      const angSol = Math.asin(Math.min(RADIO_SOL / D, 1));
      uniCorona.uRadioPx.value = Math.tan(angSol) / Math.tan(THREE.MathUtils.degToRad(camara.fov / 2)) * window.innerHeight / 2;
      // ─── Grano: aparece al acercarse ───
      uGrano.value = 1 - THREE.MathUtils.smoothstep(D, SOL.granoPleno, SOL.granoDesde);

      renderer.render(escena, camara);
    }
    animar();

    // ════════════════════════════════════════════════════════════
    //  RESIZE
    // ════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      giroPlaneta.handleResize();
      encajarFondo();
    });
  </script>
</body>
</html>
