<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema planetario — vista a escala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #05060a; }
    canvas { display: block; }
    #ayuda {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #8fa0b5; font: 12px/1.4 Arial, sans-serif; letter-spacing: .08em;
      text-transform: uppercase; opacity: .6; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="ayuda">Pincha un mundo para acercarte · pincha el vacío para volver</div>

  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ════════════════════════════════════════════════════════════
    //  RENDERER / ESCENA / CÁMARA
    // ════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0x05060a); // fondo por defecto hasta que llegue la nebulosa

    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 4000);

    // Dos puntos de referencia de cámara: la VISTA GENERAL del sistema.
    const VISTA_GENERAL   = new THREE.Vector3(0, 30, 62);
    const MIRADA_GENERAL  = new THREE.Vector3(0, 0, 0);
    camara.position.copy(VISTA_GENERAL);
    const miraActual = MIRADA_GENERAL.clone(); // objetivo de lookAt que interpolamos
    camara.lookAt(miraActual);

    const cargador = new THREE.TextureLoader();

    // ════════════════════════════════════════════════════════════
    //  FONDO: campo de estrellas procedural + nebulosa opcional
    //  - Las estrellas existen SIEMPRE (aunque no haya imagen).
    //  - Si existe imagenes/sistema/fondo-espacio.jpg (equirectangular
    //    2:1) se usa como fondo envolvente; si no, queda el color plano.
    // ════════════════════════════════════════════════════════════
    (function campoEstrellas() {
      const N = 2500;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        // puntos repartidos en la superficie de una esfera lejana
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const R = 1500;
        pos[i*3]   = R * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = R * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = R * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false });
      escena.add(new THREE.Points(geo, mat));
    })();

    cargador.load(
      '../imagenes/sistema/fondo-espacio.jpg',
      (t) => { t.colorSpace = THREE.SRGBColorSpace; t.mapping = THREE.EquirectangularReflectionMapping; escena.background = t; },
      undefined,
      () => { /* sin imagen aún: se queda el color + estrellas procedurales */ }
    );

    // ════════════════════════════════════════════════════════════
    //  TEXTURA "GLOW" (halo radial) generada en canvas, para que cada
    //  planeta se lea como un PUNTO de color desde lejos.
    // ════════════════════════════════════════════════════════════
    function texturaGlow() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const TEX_GLOW = texturaGlow();

    // ════════════════════════════════════════════════════════════
    //  ESTRELLA K (naranja). Lista para textura: si existe
    //  imagenes/sistema/sol.png se usa; si no, color plano naranja.
    //  La luz SALE del centro → la cara iluminada de cada planeta
    //  apunta siempre a la estrella (anclaje por marea sale gratis).
    // ════════════════════════════════════════════════════════════
    const matSol = new THREE.MeshBasicMaterial({ color: 0xffb066 });
    cargador.load(
      '../imagenes/sistema/sol.png',
      (t) => { t.colorSpace = THREE.SRGBColorSpace; matSol.map = t; matSol.color.set(0xffffff); matSol.needsUpdate = true; },
      undefined,
      () => {}
    );
    const sol = new THREE.Mesh(new THREE.SphereGeometry(3.0, 64, 64), matSol);
    escena.add(sol);

    // halo del sol (sprite aditivo)
    const haloSol = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, color: 0xffcc88, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    haloSol.scale.setScalar(16);
    escena.add(haloSol);

    const luzSol = new THREE.PointLight(0xffd9a0, 4, 2000, 0.08);
    escena.add(luzSol);
    escena.add(new THREE.AmbientLight(0x223044, 0.45)); // la cara nocturna no es negro absoluto

    // ════════════════════════════════════════════════════════════
    //  SHADER DE LUCES NOCTURNAS (tecnomarcadores)
    //  400 puntos ámbar sobre la esfera que SOLO brillan en la cara
    //  en sombra. Reutilizado del prototipo. dirLuz se actualiza por
    //  frame (dirección del planeta hacia la estrella).
    // ════════════════════════════════════════════════════════════
    function crearLucesNocturnas(radio) {
      const NUM = 400;
      const p = new Float32Array(NUM * 3);
      for (let i = 0; i < NUM; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        p[i*3]   = radio * Math.sin(phi) * Math.cos(theta);
        p[i*3+1] = radio * Math.sin(phi) * Math.sin(theta);
        p[i*3+2] = radio * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
      const mat = new THREE.ShaderMaterial({
        uniforms: { dirLuz: { value: new THREE.Vector3(1, 0, 0) } },
        vertexShader: `
          uniform vec3 dirLuz;
          varying float visibilidad;
          void main() {
            vec3 normalMundo = normalize((modelMatrix * vec4(position, 0.0)).xyz);
            float cara = dot(normalMundo, dirLuz);   // >0 día, <0 noche
            visibilidad = smoothstep(0.1, -0.2, cara); // solo brillan de noche
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 2.2;
          }
        `,
        fragmentShader: `
          varying float visibilidad;
          void main() {
            if (visibilidad < 0.01) discard;
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            gl_FragColor = vec4(1.0, 0.85, 0.5, visibilidad); // ámbar cálido
          }
        `,
        transparent: true,
        depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    // ════════════════════════════════════════════════════════════
    //  LOS MUNDOS
    //  tex      textura de superficie (imagenes/sistema/)
    //  r        radio del planeta
    //  dist     distancia orbital a la estrella
    //  incl     inclinación de la órbita (grados)
    //  color    color del punto/halo visto de lejos
    //  habitable  → lleva luces de ciudad en la cara nocturna
    //  anclado    → anclaje por marea (misma cara al sol). Decisión
    //               física: con estrella K sólo los interiores suelen
    //               anclarse; los exteriores rotan libres. AJUSTABLE AQUÍ.
    // ════════════════════════════════════════════════════════════
    const mundos = [
      { tex: '1-islas.png',     r: 0.9, dist: 7,  incl: 0,  color: 0x6fae7a, habitable: true,  anclado: true  },
      { tex: '2-desertica.png', r: 1.0, dist: 9.5,incl: 0,  color: 0xc88a4a, habitable: false, anclado: true  },
      { tex: '3-helado.png',    r: 0.85,dist: 12, incl: 0,  color: 0xaccadf, habitable: false, anclado: false },
      { tex: '4-templado.png',  r: 1.1, dist: 15, incl: 0,  color: 0x7bbf8f, habitable: true,  anclado: false },
      { tex: '5-lava.png',      r: 0.8, dist: 18, incl: 0,  color: 0xd1552e, habitable: false, anclado: false },
      { tex: '8-roca.png',      r: 0.7, dist: 21, incl: 14, color: 0x8a7f72, habitable: false, anclado: false },
      { tex: '6-gaseoso1.png',  r: 2.2, dist: 26, incl: 0,  color: 0xb79a6e, habitable: false, anclado: false },
      { tex: '7-estepa.png',    r: 1.0, dist: 31, incl: 0,  color: 0x9fae73, habitable: false, anclado: false }
    ];

    const planetas = [];

    mundos.forEach((m) => {
      const grupo = new THREE.Group(); // el grupo se traslada por la órbita; el mesh rota dentro
      escena.add(grupo);

      const tex = cargador.load('../imagenes/sistema/' + m.tex);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 })
      );
      grupo.add(mesh);

      // Punto/halo de color: visible de lejos, se desvanece al acercarnos
      const punto = new THREE.Sprite(new THREE.SpriteMaterial({
        map: TEX_GLOW, color: m.color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      grupo.add(punto);

      // Luces nocturnas si es habitable (hijas del mesh → rotan con él)
      let luces = null;
      if (m.habitable) {
        luces = crearLucesNocturnas(m.r * 1.004);
        mesh.add(luces);
      }

      // Órbita visible, inclinada
      const inclRad = m.incl * Math.PI / 180;
      const pts = [];
      for (let i = 0; i <= 160; i++) {
        const a = (i / 160) * Math.PI * 2;
        const x = Math.cos(a) * m.dist;
        const z = Math.sin(a) * m.dist;
        const y = Math.sin(a) * m.dist * Math.sin(inclRad);
        pts.push(new THREE.Vector3(x, y, z * Math.cos(inclRad)));
      }
      const orbita = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x2a3a4a, transparent: true, opacity: 0.5 })
      );
      escena.add(orbita);

      planetas.push({
        grupo, mesh, punto, luces,
        dist: m.dist,
        incl: inclRad,
        angulo: Math.random() * Math.PI * 2,
        velocidad: 0.02 / Math.sqrt(m.dist), // más lejos → más lento (sabor kepleriano)
        anclado: m.anclado,
        r: m.r
      });
    });

    // ════════════════════════════════════════════════════════════
    //  INTERACCIÓN: clic → vuela al planeta; clic en vacío → volver
    // ════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const raton = new THREE.Vector2();
    let planetaEnfocado = null;

    window.addEventListener('click', (e) => {
      raton.x = (e.clientX / window.innerWidth) * 2 - 1;
      raton.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(raton, camara);
      const dianas = [];
      planetas.forEach(p => { dianas.push(p.mesh, p.punto); });
      const hit = ray.intersectObjects(dianas, false);
      if (hit.length) {
        planetaEnfocado = planetas.find(p => p.mesh === hit[0].object || p.punto === hit[0].object);
      } else {
        planetaEnfocado = null; // volver a la vista general
      }
    });

    // ════════════════════════════════════════════════════════════
    //  BUCLE
    // ════════════════════════════════════════════════════════════
    const objetivoPos = new THREE.Vector3();
    const objetivoMira = new THREE.Vector3();
    const dirCam = new THREE.Vector3();

    function animar() {
      requestAnimationFrame(animar);
      sol.rotation.y += 0.0008;
      haloSol.position.copy(sol.position);

      planetas.forEach((p) => {
        // Traslación orbital
        p.angulo += p.velocidad;
        const x = Math.cos(p.angulo) * p.dist;
        const z = Math.sin(p.angulo) * p.dist;
        const y = Math.sin(p.angulo) * p.dist * Math.sin(p.incl);
        p.grupo.position.set(x, y, z * Math.cos(p.incl));

        // Anclaje por marea vs rotación libre
        if (p.anclado) {
          p.mesh.lookAt(0, 0, 0);        // misma cara a la estrella
        } else {
          p.mesh.rotation.y += 0.01;     // rota libre
        }

        // Distancia a cámara → el punto se lee de lejos y se desvanece de cerca
        const d = camara.position.distanceTo(p.grupo.position);
        p.punto.scale.setScalar(THREE.MathUtils.clamp(d * 0.028, 0.6, 7));
        p.punto.material.opacity = THREE.MathUtils.clamp((d - 4) / 7, 0, 1);

        // Luces nocturnas: dirección del planeta hacia la estrella (origen)
        if (p.luces) {
          p.luces.material.uniforms.dirLuz.value.copy(p.grupo.position).multiplyScalar(-1).normalize();
        }
      });

      // Cámara: vuela al planeta enfocado o vuelve a la vista general
      if (planetaEnfocado) {
        const pos = planetaEnfocado.grupo.position;
        // posición de cámara: a un lado del planeta, fuera de él
        dirCam.subVectors(camara.position, pos).normalize().multiplyScalar(planetaEnfocado.r * 6 + 4);
        objetivoPos.addVectors(pos, dirCam);
        objetivoMira.copy(pos);
      } else {
        objetivoPos.copy(VISTA_GENERAL);
        objetivoMira.copy(MIRADA_GENERAL);
      }
      camara.position.lerp(objetivoPos, 0.05);
      miraActual.lerp(objetivoMira, 0.05);
      camara.lookAt(miraActual);

      renderer.render(escena, camara);
    }
    animar();

    // ════════════════════════════════════════════════════════════
    //  RESIZE
    // ════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
