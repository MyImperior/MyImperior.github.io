<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba sistema planetario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background-color: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "../js/vendor/three/build/three.module.js",
      "three/addons/": "../js/vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Cámara elevada → vista ladeada ~35° sobre el plano orbital
   // ─── POSICIÓN DE CÁMARA (ajustable por ojo) ───
    const CAM_DISTANCIA = 34;   // lejanía al sol (mayor = más lejos, todo más pequeño)
    const CAM_ALTURA_GRADOS = 10;   // ángulo sobre el plano orbital (90=picado, 0=de canto)
    const CAM_RELOJ_GRADOS = 120;   // posición alrededor del sol (0=las 3, 90=las 6, 120≈las 4)

    // Conversión de esos ángulos a coordenadas XYZ (no hace falta tocar esto)
    const altRad = CAM_ALTURA_GRADOS * Math.PI / 180;
    const relRad = CAM_RELOJ_GRADOS * Math.PI / 180;
    camara.position.set(
      CAM_DISTANCIA * Math.cos(altRad) * Math.cos(relRad),
      CAM_DISTANCIA * Math.sin(altRad),
      CAM_DISTANCIA * Math.cos(altRad) * Math.sin(relRad)
    );
    camara.lookAt(0, 0, 0);

    // ─── ESTRELLA CENTRAL (tipo K, naranja) ───
    // Provisional: color plano. Cuando tengas la textura K rectangular, se mapea.
    const sol = new THREE.Mesh(
      new THREE.SphereGeometry(3, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffaa55 }) // naranja K
    );
    escena.add(sol);

    // Luz que emana del sol → ilumina las caras diurnas de los planetas
    const luzSol = new THREE.PointLight(0xfff0dd, 4, 300, 0.2);
    escena.add(luzSol); // en el origen (0,0,0), donde está el sol
    escena.add(new THREE.AmbientLight(0x334455, 0.5));

    // ─── TEXTURA COMPARTIDA (clon temporal — los 7 iguales) ───
    const texPlaneta = new THREE.TextureLoader().load('../imagenes/sistema/islas.png');
    texPlaneta.colorSpace = THREE.SRGBColorSpace;

    // ─── LOS 7 PLANETAS ───
    // Cada uno: radio propio, distancia orbital propia, velocidad propia.
    // Velocidad ~ 1/sqrt(distancia) → Kepler: los interiores más rápidos.
    const configs = [
      { r: 0.5,  dist: 6,  color: 0xffffff },
      { r: 0.6,  dist: 8,  color: 0xffffff },
      { r: 0.55, dist: 10, color: 0xffffff },
      { r: 0.7,  dist: 12.5, color: 0xffffff },
      { r: 0.65, dist: 15, color: 0xffffff },
      { r: 0.9,  dist: 18, color: 0xffffff },
      { r: 0.5,  dist: 21, color: 0xffffff }
    ];

    const planetas = [];

    configs.forEach((c) => {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(c.r, 64, 64),
        new THREE.MeshStandardMaterial({ map: texPlaneta, roughness: 1, metalness: 0 })
      );
      escena.add(mesh);

      // Órbita visible: anillo tenue en el plano XZ
      const puntos = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        puntos.push(new THREE.Vector3(Math.cos(a) * c.dist, 0, Math.sin(a) * c.dist));
      }
      const orbita = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(puntos),
        new THREE.LineBasicMaterial({ color: 0x223344 })
      );
      escena.add(orbita);

      planetas.push({
        mesh,
        dist: c.dist,
        angulo: Math.random() * Math.PI * 2,      // posición inicial aleatoria
        velocidad: 0.02 / Math.sqrt(c.dist)        // Kepler: más lejos = más lento
      });
    });

    // ─── BUCLE ───
    function animar() {
      requestAnimationFrame(animar);

      sol.rotation.y += 0.001; // el sol gira despacio

      planetas.forEach((p) => {
        p.angulo += p.velocidad;
        p.mesh.position.set(
          Math.cos(p.angulo) * p.dist,
          0,
          Math.sin(p.angulo) * p.dist
        );
        p.mesh.rotation.y += 0.01; // cada planeta rota sobre su eje
      });

      renderer.render(escena, camara);
    }
    animar();

    window.addEventListener('resize', () => {
      camara.aspect = window.innerWidth / window.innerHeight;
      camara.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
