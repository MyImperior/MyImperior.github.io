<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyImperior</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      height: 100vh;
      background-image: url('imagenes/BARCO-LEJOS.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #080810;
    }

    #capa-barco {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 80%;
      z-index: 2;
      pointer-events: auto;
    }

    #marco-memoria {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 60px;
      height: 80px;
      border: 2px solid #8a7040;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      cursor: pointer;
    }

    nav {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    nav a {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    nav a:hover { color: #ffffff; }
  </style>
</head>
<body>

  <img id="capa-barco" src="imagenes/BARCO-CERCA-BARCO.png">
  <div id="marco-memoria"></div>

  <nav>
    <a href="secciones/ciencia.html">Ciencia</a>
    <a href="secciones/cienciaficcion.html">Ciencia Ficción</a>
    <a href="secciones/arte.html">Arte</a>
    <a href="secciones/memoria.html">Memoria</a>
  </nav>

  <script>
    const barco = document.getElementById('capa-barco');

    document.addEventListener('mousemove', (e) => {
      const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      const desplazamiento = mouseX * 30;
      barco.style.transform = `translateX(calc(-50% + ${desplazamiento}px))`;
    });

    document.addEventListener('click', (e) => {
      const x = e.clientX;
      const w = window.innerWidth;
      if (x < w * 0.35) {
        window.location.href = 'secciones/cienciaficcion.html';
      } else if (x > w * 0.65) {
        window.location.href = 'secciones/arte.html';
      } else {
        window.location.href = 'secciones/ciencia.html';
      }
    });

    document.getElementById('marco-memoria').addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = 'secciones/memoria.html';
    });
    // Sistema de rayos
function lanzarRayo() {
  const flash = document.createElement('div');
  flash.style.cssText = `
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(200, 220, 255, 0.15);
    z-index: 1;
    pointer-events: none;
  `;
  document.body.appendChild(flash);

  // El flash dura 120ms y desaparece
  setTimeout(() => {
    flash.style.transition = 'opacity 0.08s';
    flash.style.opacity = '0';
    setTimeout(() => flash.remove(), 80);
  }, 120);

  // Próximo rayo en 8-18 segundos
  setTimeout(lanzarRayo, 8000 + Math.random() * 10000);
}

// Primer rayo tras 3 segundos
setTimeout(lanzarRayo, 3000);
  </script>

  <script type="module" src="js/portal.js"></script>

</body>
</html>
