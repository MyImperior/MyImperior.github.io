<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyImperior</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
  overflow: hidden;
  height: 100vh;
  background-image: url('imagenes/BARCO-LEJOS.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #080810;
}

    #capa-barco {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 80%;
      z-index: 2;
      pointer-events: none;
    }

    nav {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    nav a {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    nav a:hover { color: #ffffff; }
  </style>
</head>
<body>

  <img id="capa-barco" src="imagenes/BARCO-CERCA-BARCO.png">

  <nav>
    <a href="secciones/ciencia.html">Ciencia</a>
    <a href="secciones/cienciaficcion.html">Ciencia Ficción</a>
    <a href="secciones/arte.html">Arte</a>
    <a href="secciones/memoria.html">Memoria</a>
  </nav>

  <script>
    const barco = document.getElementById('capa-barco');

    document.addEventListener('mousemove', (e) => {
      const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      const desplazamiento = mouseX * 30;
      barco.style.transform = `translateX(calc(-50% + ${desplazamiento}px))`;
    });
  </script>

</body>
</html>
