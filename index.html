<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyImperior</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      height: 100vh;
      background-image: url('imagenes/BARCO-LEJOS.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #080810;
    }

    #marco-memoria {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 60px;
      height: 80px;
      border: 2px solid #8a7040;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      
    }

    nav {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    nav a {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 13px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    nav a:hover { color: #ffffff; }
#niebla-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(ellipse 50% 54% at 50% 83%, transparent 0%, transparent 30%, rgba(138,154,168,0.75) 60%, rgba(138,154,168,0.88) 100%),
    linear-gradient(to top, rgba(138,154,168,0.6) 0%, transparent 45%);
  z-index: 2;
  pointer-events: none;
}
  </style>
</head>
<body>
<div id="fade-overlay" style="
  position: fixed;
  top: 20%; left: 0; height: 80%;
  width: 100%; height: 100%;
  background: #000;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s;
"></div>
<!-- <div id="niebla-overlay"></div> -->
 <canvas id="niebla-canvas"></canvas>

  <div id="marco-memoria"></div>

  <nav>
    <a href="secciones/ciencia.html">Ciencia</a>
    <a href="secciones/cienciaficcion.html">Ciencia Ficción</a>
    <a href="secciones/arte.html">Arte</a>
    <a href="secciones/memoria.html">Memoria</a>
  </nav>

  <script>
    document.addEventListener('click', (e) => {
      const x = e.clientX;
      const w = window.innerWidth;
      if (x < w * 0.35) {
        window.location.href = 'secciones/cienciaficcion.html';
      } else if (x > w * 0.65) {
        window.location.href = 'secciones/arte.html';
      } else {
        window.location.href = 'secciones/ciencia.html';
      }
    });

let temporizadorMemoria;
const marco = document.getElementById('marco-memoria');

marco.addEventListener('mousedown', (e) => {
  e.stopPropagation();
  temporizadorMemoria = setTimeout(() => {
    const overlay = document.getElementById('fade-overlay');
    overlay.style.opacity = '1';
    setTimeout(() => {
      window.location.href = 'secciones/memoria.html';
    }, 1200);
  }, 5000);
});

marco.addEventListener('mouseup', () => {
  clearTimeout(temporizadorMemoria);
});

marco.addEventListener('mouseleave', () => {
  clearTimeout(temporizadorMemoria);
});
    // Sistema de rayos
    function lanzarRayo() {
      const flash = document.createElement('div');
      flash.style.cssText = `
        position: fixed;
        top: 20%; left: 0; height: 80%;
        width: 100%; height: 100%;
        background: rgba(200, 220, 255, 0.15);
        z-index: 1;
        pointer-events: none;
      `;
      document.body.appendChild(flash);

      setTimeout(() => {
        flash.style.transition = 'opacity 0.12s';
        flash.style.opacity = '0';
        setTimeout(() => flash.remove(), 80);
      }, 120);

      setTimeout(lanzarRayo, 8000 + Math.random() * 10000);
    }

    setTimeout(lanzarRayo, 3000);

    function crearRayo(left, top) {
      const rayo = document.createElement('div');
      rayo.style.cssText = `
        position: fixed;
        left: ${left}%;
        top: ${top}%;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220,235,255,0.35) 0%, rgba(180,210,255,0.15) 40%, transparent 70%);
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.05s;
      `;
      document.body.appendChild(rayo);

      setTimeout(() => rayo.style.opacity = '1', 10);
      setTimeout(() => {
        rayo.style.transition = 'opacity 0.3s';
        rayo.style.opacity = '0';
        setTimeout(() => rayo.remove(), 300);
      }, 150);
    }

    function rayoCiudad() {
      crearRayo(18, 52);
      setTimeout(rayoCiudad, 8000 + Math.random() * 8000);
    }

    function rayoMontana() {
      crearRayo(78, 48);
      setTimeout(rayoMontana, 10000 + Math.random() * 10000);
    }

    setTimeout(rayoCiudad, 3000);
    setTimeout(rayoMontana, 6000);
  </script>

  <script type="importmap">

    "imports": {
"three": "./js/vendor/three/build/three.module.js",
"three/addons/": "./js/vendor/three/examples/jsm/"    }
  }
  </script>
  <script type="module" src="js/portal.js"></script>

</body>
</html>
